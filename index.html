<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kestrel Buttons CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark teal sidebar + light working canvas; compact tables, status pills carry state */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --surface-2:#edf2f2; --line:#dbe3e3; --line-strong:#c3cfcf;
  --fg:#14232a; --muted:#56676d; --faint:#87969b;
  --accent:#0b7775; --accent-strong:#075c5a; --accent-soft:#ddf0ef; --on-accent:#ffffff;
  --side:#0f2a2d; --side-fg:#d3e5e4; --side-muted:#83a1a0; --side-hover:#173a3e; --side-active:#1d4a4e; --side-line:#1f3d40;
  --ok:#1b7a45; --ok-soft:#e0f2e7; --warn:#935600; --warn-soft:#fbeed6; --bad:#b0352a; --bad-soft:#fae3e0;
  --info:#2a62a3; --info-soft:#e2ecf8; --neutral:#5d6b70; --neutral-soft:#e9eeef;
  --shadow:0 1px 2px rgba(15,42,45,.05),0 6px 20px rgba(15,42,45,.06);
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#152023; --surface-2:#1a272a; --line:#253538; --line-strong:#33484b;
  --fg:#e2ebeb; --muted:#9db0b2; --faint:#6e8386;
  --accent:#3db4ae; --accent-strong:#6dcfc9; --accent-soft:#133a3a; --on-accent:#05201f;
  --side:#091214; --side-fg:#cfe0df; --side-muted:#7b9796; --side-hover:#122427; --side-active:#173235; --side-line:#172a2d;
  --ok:#5cc78a; --ok-soft:#123224; --warn:#e2a74c; --warn-soft:#382a11; --bad:#ef8579; --bad-soft:#3b1c19;
  --info:#7eaeea; --info-soft:#162a43; --neutral:#a3b2b5; --neutral-soft:#223134;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#152023; --surface-2:#1a272a; --line:#253538; --line-strong:#33484b;
  --fg:#e2ebeb; --muted:#9db0b2; --faint:#6e8386;
  --accent:#3db4ae; --accent-strong:#6dcfc9; --accent-soft:#133a3a; --on-accent:#05201f;
  --side:#091214; --side-fg:#cfe0df; --side-muted:#7b9796; --side-hover:#122427; --side-active:#173235; --side-line:#172a2d;
  --ok:#5cc78a; --ok-soft:#123224; --warn:#e2a74c; --warn-soft:#382a11; --bad:#ef8579; --bad-soft:#3b1c19;
  --info:#7eaeea; --info-soft:#162a43; --neutral:#a3b2b5; --neutral-soft:#223134;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* Shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand-mark{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.01em;line-height:1.1}
.brand-sub{font-size:11px;color:var(--side-muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.nav-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--side-fg);font-weight:500}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .badge{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--side-line);color:var(--side-fg);border-radius:10px;padding:0 7px;line-height:18px}
.nav .badge.alert{background:var(--bad);color:#fff}
.side-foot{margin-top:auto;padding:14px 16px 18px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:10px}
.side-foot label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);display:block;margin-bottom:4px}
.side-foot select{width:100%;background:var(--side-hover);color:var(--side-fg);border:1px solid var(--side-line);border-radius:6px;padding:7px 8px}
.who{display:flex;align-items:center;gap:9px;font-size:12.5px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--side-active);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--side-fg);flex:none}
.sim-note{font-size:11px;color:var(--side-muted);line-height:1.35}

.main{min-width:0;display:flex;flex-direction:column}
.proto-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:7px 28px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;border-bottom:1px solid var(--line)}
.proto-bar b{font-weight:600}
.content{padding:22px 28px 48px;display:flex;flex-direction:column;gap:18px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:4px}
.crumbs button{all:unset;cursor:pointer;color:var(--accent)} .crumbs button:hover{text-decoration:underline}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:14.5px;font-weight:600;margin:0}
h3{font-size:12px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sub{color:var(--muted);margin:3px 0 0;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.btn-danger{color:var(--bad);border-color:var(--line-strong)} .btn-danger:hover{border-color:var(--bad);color:var(--bad)}
.btn-sm{padding:4px 9px;font-size:12px}
.btn-link{all:unset;cursor:pointer;color:var(--accent);font-weight:500} .btn-link:hover{text-decoration:underline}
.btn svg{width:15px;height:15px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-body{padding:14px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1fr) 320px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .k-label{font-size:12px;color:var(--muted);font-weight:500}
.kpi .k-val{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k-note{font-size:12px;color:var(--faint)}
.kpi.alert .k-val{color:var(--bad)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:18px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.p-open,.p-new{background:var(--info-soft);color:var(--info)}
.p-won,.p-qualified,.p-active,.p-resolved,.p-confirmed,.p-approved{background:var(--ok-soft);color:var(--ok)}
.p-lost,.p-problem,.p-rejected{background:var(--bad-soft);color:var(--bad)}
.p-nq,.p-inactive,.p-neutral{background:var(--neutral-soft);color:var(--neutral)}
.p-recontact,.p-pending,.p-requested,.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-nextcontact,.p-sent{background:var(--accent-soft);color:var(--accent-strong)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--warn)}
.flag svg{width:13px;height:13px}
.due-over{color:var(--bad);font-weight:600} .due-soon{color:var(--warn);font-weight:600}

/* Filters */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.search input{width:100%;padding:7px 10px 7px 31px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.toolbar select{padding:7px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-strong)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.count{margin-left:auto;font-size:12px;color:var(--faint)}

/* Tables */
.table-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.data td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data tr.row{cursor:pointer}
table.data tr.row:hover td{background:var(--surface-2)}
table.data tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
td .primary{font-weight:600} td .secondary{font-size:12px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Detail */
.detail-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px 18px}
.meta dt{font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.meta dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.kv{display:flex;flex-direction:column;gap:10px}
.kv div{display:flex;justify-content:space-between;gap:12px}
.kv span:first-child{color:var(--muted);font-size:12.5px}
.kv span:last-child{font-weight:500;text-align:right}
.next-box{background:var(--accent-soft);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.next-box .nb-date{font-weight:600;color:var(--accent-strong)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:11px 10px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .tc{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:4px}
.addr{display:flex;flex-direction:column;gap:10px}
.addr div{display:grid;grid-template-columns:90px 1fr;gap:8px}
.notes{white-space:pre-wrap;margin:0}
.readonly{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:4px 9px;border-radius:6px}
.readonly svg{width:13px;height:13px}
.rule-note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:10px 12px;border-left:3px solid var(--line-strong)}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .date{font-family:var(--f-mono);font-size:12px;line-height:1.3}
.li .title{font-weight:600;overflow-wrap:anywhere}
.li .desc{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.li .side-act{display:flex;gap:6px;align-items:center}
.bucket-head{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600;font-size:12.5px}
.bucket-head .n{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}

/* Charts */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:128px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12.5px}
.bar-track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden;display:flex}
.bar-fill{height:100%;background:var(--accent)}
.bar-fill.b2{background:var(--line-strong)}
.bar-fill.bad{background:var(--bad)}
.bar-val{text-align:right;font-family:var(--f-mono);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end}
.barbox{height:180px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border-bottom:1px solid var(--line-strong)}
.yaxis{display:flex;flex-direction:column;justify-content:space-between;height:160px;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);text-align:right;align-self:start;margin-top:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.stack{width:min(38px,70%);display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;background:var(--surface-2)}
.stack span{display:block}
.col .lbl{font-size:11.5px;color:var(--muted)}
.col .tot{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.plot{position:relative}
.plot .grid-l{position:absolute;left:36px;right:0;border-top:1px dashed var(--line)}
.c-won{background:var(--ok)} .c-lost{background:var(--bad)} .c-open{background:var(--info)}
.split{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.split span{display:block;height:100%}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(8,20,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:560px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 10px 10px}
.modal-foot .proto{margin-right:auto;font-size:11.5px;color:var(--warn)}
.x{all:unset;cursor:pointer;padding:4px;border-radius:4px;color:var(--muted)} .x:hover{background:var(--surface-2)}
.x svg{width:18px;height:18px;display:block}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600}
.field label .req{color:var(--bad);margin-left:2px}
.field .hint{font-size:11.5px;color:var(--faint);font-weight:400}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.field textarea{min-height:72px;resize:vertical}
.radio-row{display:flex;flex-wrap:wrap;gap:8px}
.radio-row label{display:flex;align-items:center;gap:7px;border:1px solid var(--line-strong);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.radio-row input:checked+span{color:var(--accent-strong)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:9px 12px;font-size:12.5px;font-weight:500}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:9px 12px;font-size:12.5px}
.infobox{background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:12.5px;color:var(--muted)}

.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;max-width:360px;box-shadow:var(--shadow);z-index:60;transition:opacity .2s,transform .2s}
.toast[hidden]{display:none}

/* Submitter */
.submit-wrap{max-width:640px}

@media (max-width:1100px){.g-main{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:column}
  .brand{padding:12px 16px 4px}
  .nav{flex-direction:row;overflow-x:auto;padding:6px 12px}
  .nav-label{display:none}
  .nav button{white-space:nowrap}
  .side-foot{flex-direction:row;flex-wrap:wrap;margin-top:0;padding:10px 16px}
  .side-foot>div{flex:1 1 150px}
  .side-foot .who,.side-foot .sim-note{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .content{padding:18px 16px 40px}
  .proto-bar{padding:7px 16px}
}
@media (max-width:520px){
  .fields{grid-template-columns:minmax(0,1fr)}
  .bar-row{grid-template-columns:96px minmax(0,1fr) 44px}
  .li{grid-template-columns:64px minmax(0,1fr)}
  .li .side-act{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v0.2 additions */
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hist li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:2px 10px}
.hist li .faint{grid-column:2}
.bar-fill.warn{background:var(--warn)} .bar-fill.info{background:var(--info)} .bar-fill.neutral{background:var(--neutral)}
.modal.wide{max-width:760px}
.fixed{padding:8px 0;font-weight:500;overflow-wrap:anywhere}
.irows{display:flex;flex-direction:column;gap:8px}
.irow{display:grid;gap:8px;align-items:center}
.irow.o{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) 30px}

function qualifyLead(l, assessment){
  const u = currentUser(), id = nextId('A', DB.accounts);

  DB.accounts.push({ id, name:l.company, country:l.country||'', phone:l.phone||'', status:'Active', teamId:l.teamId, source:l.source,

    contacts: hasContact ? [C(l.contactName||'(name not provided)','',l.email||'',l.phone||'','',u,TODAY_STR)] : [] });
  Object.assign(l, { status:'Qualified', assessment, accountId:id, qualifiedBy:u, qualifiedAt:TODAY_STR });
  l.history.push({ at:TODAY_STR, by:u, action:`Qualified. Account ${id} created for ${team(l.teamId).name}` });
  return id;
}
function recordOrder(o){
  // Saving an order = recording a confirmed order. Only the linked opportunity can change.
  DB.orders.push(o);
  if(o.oppId){ const op = opp(o.oppId); if(op && op.status==='Open'){ op.status = 'Won'; return true; } }
  return false;
}

  const O = DB.opps, won = O.filter(o => o.status==='Won'), lost = O.filter(o => o.status==='Lost'), open = O.filter(o => o.status==='Open');
  const winRate = won.length + lost.length ? Math.round(won.length / (won.length + lost.length) * 100) : 0;
  const qRate = decided.length ? Math.round(q.length / decided.length * 100) : 0;
  const probs = DB.problems.filter(p => p.status==='Open').sort((a,b) => a.date.localeCompare(b.date));

  const dupCount = L.filter(l => l.status==='Duplicate').length;
  const qRes = [['Pending qualification', L.filter(inMgmtQueue).length, 'warn'], ['Qualified', q.length, ''],
    ...NQ_REASONS.map(r => [`Not qualified: ${r}`, L.filter(l => l.status==='Not Qualified' && l.reason===r).length, 'neutral'])];
  const qMax = Math.max(...qRes.map(x => x[1]), dupCount, 1);
  const qualRows = qRes.map(([l,n,c]) => barRow(l, [[n,c]], n, qMax)).join('')
    + (dupCount ? `<div class="bar-sep">Not a qualification decision</div>${barRow('Resolved as duplicate', [[dupCount,'info']], dupCount, qMax)}` : '');

  const A = DB.accounts, aMax = Math.max(...SOURCES.map(s => A.filter(a => a.source===s).length), 1);
  const since = WINDOW_START, newA = A.filter(a => a.createdAt >= since), newLead = newA.filter(a => a.leadId).length, newDirect = newA.length - newLead;
  // Each account counted once, by its own source and origin (leadId = created via a Management-qualified lead)
  const acqTotal = A.length, acqLead = A.filter(a => a.leadId).length, acqDirect = acqTotal - acqLead;
  const accSources = SOURCES.map(s => { const all = A.filter(a => a.source===s), fromLead = all.filter(a => a.leadId).length;
    return barRow(s, [[fromLead,''],[all.length-fromLead,'b2']], all.length, aMax)
      .replace('<div class="bar-row">', `<div class="bar-row acq-row" tabindex="0" data-src="${esc(s)}" data-lead="${fromLead}" data-direct="${all.length-fromLead}" data-total="${all.length}">`); }).join('');

  const months = WINDOW_MONTHS;
  const mData = months.map(m => { const os = O.filter(o => o.date.startsWith(m)); return { m, won:os.filter(o=>o.status==='Won').length, lost:os.filter(o=>o.status==='Lost').length, open:os.filter(o=>o.status==='Open').length }; });
  const mMax = Math.max(4, ...mData.map(d => d.won+d.lost+d.open)), top = Math.ceil(mMax/2)*2, H = 160;
  const cols = mData.map(d => { const t = d.won+d.lost+d.open; return `<div class="col"><div class="barbox"><span class="tot">${t}</span><div class="stack" style="height:${t/top*H}px">${['won','lost','open'].map(k => d[k] ? `<span class="c-${k}" style="height:${d[k]/t*100}%" title="${k}: ${d[k]}"></span>` : '').join('')}</div></div><span class="lbl">${MON[+d.m.slice(5)-1]}</span></div>`; }).join('');

  const lossCounts = LOSS_REASONS.map(r => [r, lost.filter(o => o.lossReason===r).length]).filter(x => x[1]).sort((a,b) => b[1]-a[1]);
  const lossMax = Math.max(...lossCounts.map(x => x[1]), 1);
  const losses = lossCounts.map(([r,n]) => barRow(r, [[n,'bad']], n, lossMax)).join('');

  const teamRows = DB.teams.map(t => {
    const ac = A.filter(a => a.teamId===t.id), ids = ac.map(a => a.id);
    const to = O.filter(o => ids.includes(o.accountId)), w = to.filter(o=>o.status==='Won').length, l = to.filter(o=>o.status==='Lost').length;
    const od = ac.filter(a => a.status==='Active' && a.nextContact && dd(a.nextContact)<0).length;
    const pr = DB.problems.filter(p => ids.includes(p.accountId) && p.status==='Open').length;
    const wr = w+l ? Math.round(w/(w+l)*100) : null;
    return `<tr><td><div class="primary">${t.name}</div><div class="secondary">${esc(teamPeopleText(t))}</div></td>
      <td class="num">${ac.filter(a=>a.status==='Active').length}</td><td class="num">${ac.filter(a=>a.createdAt>=WINDOW_START&&a.leadId).length} / ${ac.filter(a=>a.createdAt>=WINDOW_START&&!a.leadId).length}</td><td class="num">${to.filter(o=>o.status==='Open').length}</td>
      <td class="num">${w}</td><td class="num">${l}</td>
      <td style="min-width:130px"><div style="display:flex;align-items:center;gap:8px"><div class="split" style="flex:1"><span class="c-won" style="width:${wr??0}%"></span><span class="c-lost" style="width:${wr===null?0:100-wr}%"></span></div><span class="mono">${wr===null?'—':wr+'%'}</span></div></td>
      <td class="num ${od?'due-over':''}">${od}</td><td class="num">${pr}</td></tr>`; }).join('');

  const orderRows = DB.teams.map(t => { const ids = A.filter(a => a.teamId===t.id).map(a => a.id), os = DB.orders.filter(o => ids.includes(o.accountId));
    return `<tr><td class="primary">${t.name}</td><td class="num">${os.length}</td><td class="num">${os.filter(o=>o.oppId).length} / ${os.filter(o=>!o.oppId).length}</td><td class="mono" style="text-align:right">${fmtTotals(sumByCurrency(os))}</td></tr>`; }).join('');

  return `
  <div class="page-head"><div><h1>${isA() ? 'Business overview' : 'Management overview'}</h1><p class="sub">Lead qualification, opportunity outcomes, problems and recorded orders across all sales teams.</p></div>
    <div class="actions">${isM() ? `<button class="btn" data-act="nav" data-arg="leads">Review lead queue (${L.filter(inMgmtQueue).length})</button>` : readOnlyChip()}</div></div>
  <div class="kpis">
    <div class="kpi"><span class="k-label">Management lead queue</span><span class="k-val">${L.filter(inMgmtQueue).length}</span><span class="k-note">${L.filter(l=>l.status==='Qualified').length} qualified to date</span></div>
    <div class="kpi"><span class="k-label">New accounts, last 6 months</span><span class="k-val">${newA.length}</span><span class="k-note">${newLead} via lead · ${newDirect} created by Sales</span></div>
    <div class="kpi"><span class="k-label">Opportunities</span><span class="k-val">${open.length} open</span><span class="k-note">${won.length} won · ${lost.length} lost · win rate ${winRate}%</span></div>
    <div class="kpi ${probs.length?'alert':''}"><span class="k-label">Unresolved problems</span><span class="k-val">${probs.length}</span><span class="k-note">Across ${new Set(probs.map(p=>p.accountId)).size} accounts</span></div>
  </div>
  <div class="grid g2">
    <section class="card"><div class="card-head"><h2>Account Acquisition by Source</h2><div class="legend"><span><i style="background:var(--accent)"></i>Via Management-qualified lead</span><span><i style="background:var(--line-strong)"></i>Created directly by Sales</span></div></div>
      <div class="card-body"><div class="acq-sum">
        <div><span class="acq-n">${acqTotal}</span><span class="acq-l">Total accounts</span></div>
        <div><span class="acq-n">${acqLead}</span><span class="acq-l">Via leads</span></div>
        <div><span class="acq-n">${acqDirect}</span><span class="acq-l">Created directly by Sales</span></div></div>
        <div class="bars">${accSources}</div><p class="sub" style="margin-top:12px">Each account is counted once, by its account source. The number at the end of each bar is that source's total.</p></div></section>
    <section class="card"><div class="card-head"><h2>Qualification results</h2><span class="faint" style="font-size:12px">${L.length} leads · ${qRate}% qualified</span></div>
      <div class="card-body"><div class="bars">${qualRows}</div><p class="sub" style="margin-top:12px">Qualification rate: ${q.length} qualified of ${decided.length} decided leads (Qualified + Not qualified). Pending leads, duplicates and accounts created directly by Sales are excluded.</p></div></section>
  </div>
  <div class="grid g2">
    <section class="card"><div class="card-head"><h2>Opportunity outcomes by month</h2><div class="legend"><span><i class="c-won"></i>Won ${won.length}</span><span><i class="c-lost"></i>Lost ${lost.length}</span><span><i class="c-open"></i>Open ${open.length}</span></div></div>
      <div class="card-body"><div class="cols">${cols}</div><p class="sub" style="margin-top:8px">Grouped by opportunity date. Bar height is the number of opportunities.</p></div></section>
    <section class="card"><div class="card-head"><h2>Loss reasons</h2><span class="faint" style="font-size:12px">${lost.length} lost</span></div>
      <div class="card-body"><div class="bars">${losses || '<p class="muted">No lost opportunities.</p>'}</div></div></section>
  </div>
  <div class="grid">
    <section class="card"><div class="card-head"><h2>Sales team comparison</h2><span class="faint" style="font-size:12px">All time</span></div>
      <div class="table-wrap"><table class="data"><thead><tr><th>Team</th><th>Active accts</th><th>New, last 6 months (lead / direct)</th><th>Open opps</th><th>Won</th><th>Lost</th><th>Win rate</th><th>Overdue contacts</th><th>Open problems</th></tr></thead><tbody>${teamRows}</tbody></table></div></section>
  </div>
  <div class="grid g2">
    <section class="card"><div class="card-head"><h2>Unresolved problems</h2><span class="faint" style="font-size:12px">Oldest first</span></div>
      <div class="list">${probs.map(p => problemItem(p,{team:true})).join('') || '<div class="empty">No unresolved problems.</div>'}</div></section>
    <section class="card"><div class="card-head"><h2>Recorded orders</h2><span class="faint" style="font-size:12px">Totals by currency</span></div>
      <div class="table-wrap"><table class="data"><thead><tr><th>Team</th><th>Orders</th><th>Linked / account-level</th><th style="text-align:right">Total value</th></tr></thead>
      <tbody>${orderRows}<tr><td class="primary">All teams</td><td class="num">${DB.orders.length}</td><td class="num">${DB.orders.filter(o=>o.oppId).length} / ${DB.orders.filter(o=>!o.oppId).length}</td><td class="mono" style="text-align:right;font-weight:600">${fmtTotals(sumByCurrency(DB.orders))}</td></tr></tbody></table></div>
      <div class="card-body"><p class="sub" style="margin:0">Manually recorded orders. Currencies are not converted, so totals are shown per currency.</p></div></section>
  </div>`;
}

function dashSales(){
  const t = team(S.teamId), items = contactItems();
  const overdue = items.filter(a => dd(a.nextContact)<0);
  const upcoming = items.filter(a => dd(a.nextContact)>=0 && dd(a.nextContact)<=14);
  const openOpps = visOpps().filter(o => o.status==='Open').sort((x,y) => x.date.localeCompare(y.date));
  const probs = openProblems();
  const block = (title, html, note) => `<section class="card"><div class="card-head"><h2>${title}</h2><span class="faint" style="font-size:12px">${note}</span></div><div class="list">${html}</div></section>`;
  const oppItems = openOpps.map(o => { const a = acc(o.accountId), ns = DB.samples.filter(s => s.oppId===o.id).length;
    return `<div class="li" data-act="open" data-arg="opp:${o.id}" tabindex="0" role="link"><div class="date"><div>${fdShort(o.date)}</div><div class="faint" style="font-size:11px">${-dd(o.date)} days open</div></div>
      <div style="min-width:0"><div class="title">${esc(o.name)}</div><div class="desc">${esc(a.name)} · ${ns} sample request${ns===1?'':'s'}</div></div><div class="side-act">${pill('Open')}</div></div>`; }).join('');
  return `
  <div class="page-head"><div><h1>${t.name}</h1><p class="sub">${esc(peopleShareText(t))} share these records and next contacts.</p></div>
    <div class="actions"><button class="btn btn-primary" data-act="modal" data-arg="newaccount">${I.plus}New account</button></div></div>
  <div class="kpis">
    <div class="kpi ${overdue.length?'alert':''}"><span class="k-label">Overdue account contacts</span><span class="k-val">${overdue.length}</span><span class="k-note">Next contact date has passed</span></div>
    <div class="kpi"><span class="k-label">Upcoming contacts</span><span class="k-val">${items.filter(a => dd(a.nextContact)>=0 && dd(a.nextContact)<=7).length}</span><span class="k-note">Due in the next 7 days</span></div>
    <div class="kpi"><span class="k-label">Open opportunities</span><span class="k-val">${openOpps.length}</span><span class="k-note">${visAccounts().filter(a=>a.status==='Active').length} active accounts</span></div>
    <div class="kpi ${probs.length?'alert':''}"><span class="k-label">Unresolved problems</span><span class="k-val">${probs.length}</span><span class="k-note">Owned by the team</span></div>
  </div>
  <div class="grid g2">
    ${block('Overdue account contacts', overdue.map(a => contactItem(a)).join('') || '<div class="empty">Nothing overdue.</div>', `${overdue.length} accounts`)}
    ${block('Upcoming account contacts', upcoming.map(a => contactItem(a)).join('') || '<div class="empty">No contacts in the next 14 days.</div>', 'Next 14 days')}
    ${block('Open opportunities', oppItems || '<div class="empty">No open opportunities.</div>', 'Oldest first')}
    ${block('Unresolved problems', probs.map(p => problemItem(p)).join('') || '<div class="empty">No unresolved problems.</div>', 'Oldest first')}
  </div>`;
}

/* Leads */
function viewLeads(){
  const f = S.f.leads, q = f.q.toLowerCase(), base = visLeads();
  const rows = base.filter(l => (!f.status || l.status===f.status) && (!f.source || l.source===f.source) &&
    (!q || [l.company,l.contactName,countryName(l.country),l.email].join(' ').toLowerCase().includes(q))).sort((a,b) => b.createdAt.localeCompare(a.createdAt));
  const c = s => base.filter(l => l.status===s).length;
  const segs = [['','All'], ...(isV() ? [[PENDING,`Pending ${c(PENDING)}`]] : []), ['Qualified','Qualified'], ...(isV() ? [['Not Qualified','Not qualified'], ['Duplicate',`Duplicate ${c('Duplicate')}`]] : [])];
  const body = rows.map(l => { const dup = duplicateOf(l.company), pending = l.status===PENDING;
    const action = canMgmtQualify(l) || canSalesQualify(l) ? `<button class="btn btn-sm btn-primary" data-act="modal" data-arg="leadview:${l.id}">Qualify</button>`
      : canMgmtReassign(l) ? `<button class="btn btn-sm" data-act="modal" data-arg="leadview:${l.id}">Reassign</button>`
      : l.accountId && canSeeAccount(acc(l.accountId)) ? `<button class="btn-link" data-act="open" data-arg="account:${l.accountId}">${l.accountId}</button>` : '';
    return `<tr class="row" data-act="modal" data-arg="leadview:${l.id}" tabindex="0">
      <td class="mono">${l.id}</td>
      <td><div class="primary">${esc(l.company)}</div><div class="secondary">${esc(countryName(l.country)||'—')}${l.contactName ? ' · '+esc(l.contactName) : ''}</div>
        ${dup && pending ? `<div class="flag">${I.warn}Matches account ${dup.id}</div>` : ''}</td>
      <td>${esc(l.source)}</td>
      <td><div class="secondary" style="color:var(--fg)">${esc(l.email||'')}</div><div class="secondary">${esc(l.phone||'')}</div></td>
      <td><div class="mono">${fd(l.createdAt)}</div><div class="secondary">${esc(l.createdBy.name)}</div></td>
      <td>${pill(l.status)}${l.reason ? `<div class="secondary" style="margin-top:3px">${esc(l.reason)}</div>` : ''}${l.duplicateOf ? `<div class="secondary" style="margin-top:3px">of ${l.duplicateOf.id}</div>` : ''}</td>
      ${isV() ? `<td>${l.teamId ? esc(teamName(l.teamId)) : '<span class="tag">Mgmt queue</span>'}</td>` : ''}

    <div class="actions"><button class="btn btn-primary" data-act="modal" data-arg="lead">${I.plus}Submit lead</button></div></div>
  <section class="card">
    <div class="toolbar">
      <div class="search">${I.search}<input id="lq" data-filter="leads.q" value="${esc(f.q)}" placeholder="Search company, contact, country" aria-label="Search leads"></div>
      <div class="seg" role="group" aria-label="Status">${segs.map(([v,l]) => `<button data-act="filter" data-arg="leads.status:${v}" aria-pressed="${f.status===v}">${l}</button>`).join('')}</div>
      <select id="lsrc" data-filter="leads.source" aria-label="Source"><option value="">All sources</option>${SOURCES.map(s => `<option ${f.source===s?'selected':''}>${s}</option>`).join('')}</select>
      <span class="count">${rows.length} of ${base.length}</span>
    </div>
    <div class="table-wrap"><table class="data"><thead><tr><th>ID</th><th>Company</th><th>Source</th><th>Contact method</th><th>Submitted</th><th>Status</th>${isV()?'<th>Team</th>':''}<th></th></tr></thead>
    <tbody>${body || `<tr><td colspan="8" class="empty">No leads match these filters.</td></tr>`}</tbody></table></div>
  </section>`;
}

/* Customer performance: computed from records each render, scoped to one account */
function accountKPIs(aid){
  const opps = DB.opps.filter(o => o.accountId===aid), oppIds = new Set(opps.map(o => o.id));
  const orders = DB.orders.filter(o => o.accountId===aid);
  const samples = DB.samples.filter(sm => oppIds.has(sm.oppId));
  // A sample request converts when an order on the same account AND opportunity, dated on/after the request, contains one of its item codes
  const converted = samples.filter(sm => orders.some(o => o.oppId===sm.oppId && o.requestDate >= sm.requestDate
    && o.items.some(it => sm.items.some(si => sameCode(si.code, it.code))))).length;
  const won = opps.filter(o => o.status==='Won').length, lost = opps.filter(o => o.status==='Lost').length;
  const probs = DB.problems.filter(p => p.accountId===aid);
  return { orders:orders.length, linked:orders.filter(o => o.oppId).length, revenue:sumByCurrency(orders),
    samples:samples.length, converted, convPct: samples.length ? Math.round(converted / samples.length * 100) : null,
    opps:opps.length, open:opps.length - won - lost, won, lost, winPct: won + lost ? Math.round(won / (won + lost) * 100) : null,
    problems:probs.length, unresolved:probs.filter(p => p.status==='Open').length };
}
function performanceCard(a){
  const k = accountKPIs(a.id), rev = Object.entries(k.revenue);
  const card = (label, val, note, cls='') => `<div class="kpi ${cls}"><span class="k-label">${label}</span>${val}<span class="k-note">${note}</span></div>`;
  return `<section class="card"><div class="card-head"><h2>Customer performance</h2><span class="faint" style="font-size:12px">All records for this account</span></div>
    <div class="card-body"><div class="perf">
      ${card('Total orders', `<span class="k-val">${k.orders}</span>`, k.orders ? `${k.linked} linked to opportunities · ${k.orders - k.linked} account-level` : 'No orders recorded')}
      ${card('Total revenue', rev.length ? `<span class="k-val rev ${rev.length>1?'multi':''}">${rev.map(([c,n]) => `<span>${money(n,c)}</span>`).join('')}</span>` : '<span class="k-val">—</span>',
        rev.length>1 ? 'Separate totals per currency, not converted' : rev.length ? 'Sum of order line totals' : 'No revenue recorded')}
      ${card('Sample-to-order conversion', `<span class="k-val">${k.convPct===null ? '—' : k.convPct+'%'}</span>`, k.samples ? `${k.converted} of ${k.samples} requests matched by item code` : 'No sample requests')}
      ${card('Total opportunities', `<span class="k-val">${k.opps}</span>`, `${k.open} open · ${k.won} won · ${k.lost} lost`)}
      ${card('Opportunity win rate', `<span class="k-val">${k.winPct===null ? '—' : k.winPct+'%'}</span>`, k.won + k.lost ? `${k.won} won · ${k.lost} lost · open excluded` : 'No won or lost opportunities yet')}
      ${card('Total problems', `<span class="k-val">${k.problems}</span>`, `${k.unresolved} unresolved`, k.unresolved ? 'warn' : '')}
    </div><p class="sub" style="margin:12px 0 0">Sample conversion is a proxy: a request counts when one of its item codes appears in a later order on the same opportunity. It does not confirm physical sample approval.</p></div></section>`;
}

function dupMessage(formType, company, dup){
  return formType==='newaccount'
    ? `${company} already exists as account ${dup.id} (${team(dup.teamId).name}). A duplicate account cannot be created.`
    : `${company} matches existing account ${dup.id}. The lead will be flagged as a possible duplicate.`;
}
const dupBox = (formType, company) => { const dup = company ? duplicateOf(company) : null;
  return dup ? `<div class="warnbox" data-dup>${esc(dupMessage(formType, company, dup))}</div>` : ''; };

/* Searchable country picker: the text box filters the ISO list; the hidden input holds the selected code. */
function countryPicker(id, code){
  code = COUNTRY_BY_CODE[code] ? code : '';
  return `<div class="cpick" data-cpick="${id}">
    <input type="hidden" id="${id}" name="${id}" value="${esc(code)}">
    <input type="text" id="${id}-q" class="cpick-q" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="${id}-list" autocomplete="off" spellcheck="false" placeholder="Search country (optional)" value="${esc(countryName(code))}">
    <button type="button" class="cpick-clear" data-cpick-clear aria-label="Clear country" ${code?'':'hidden'}>${I.x}</button>
    <ul class="cpick-list" id="${id}-list" role="listbox" hidden></ul>
    <div class="cpick-msg" hidden>Choose a country from the list, or clear the field.</div>
  </div>`;
}
const CP = {
  els: box => ({ box, hid:box.querySelector('input[type=hidden]'), q:box.querySelector('.cpick-q'), list:box.querySelector('.cpick-list'), clr:box.querySelector('.cpick-clear'), msg:box.querySelector('.cpick-msg') }),
  open(box){ const e = CP.els(box), sel = e.hid.value, typed = sel && e.q.value===countryName(sel) ? '' : e.q.value, items = searchCountries(typed);
    e.list.innerHTML = items.length ? items.map(c => `<li role="option" id="${e.hid.id}-opt-${c.code}" data-code="${c.code}" aria-selected="${c.code===sel}"><span>${esc(c.name)}</span><span class="cc">${c.code}</span></li>`).join('')
      : '<li class="none" aria-disabled="true">No matching country</li>';
    e.list.hidden = false; e.q.setAttribute('aria-expanded','true');
    const selIdx = items.findIndex(c => c.code===sel); CP.mark(box, selIdx >= 0 && !typed ? selIdx : 0); },
  close(box){ const e = CP.els(box); e.list.hidden = true; e.q.setAttribute('aria-expanded','false'); e.q.removeAttribute('aria-activedescendant'); },
  mark(box, idx){ const e = CP.els(box), opts = [...e.list.querySelectorAll('li[data-code]')]; if(!opts.length) return;
    idx = Math.max(0, Math.min(idx, opts.length-1)); opts.forEach((o,i) => o.classList.toggle('active', i===idx));
    e.q.setAttribute('aria-activedescendant', opts[idx].id); opts[idx].scrollIntoView?.({block:'nearest'}); },
  choose(box, code){ const e = CP.els(box); e.hid.value = code; e.q.value = countryName(code); e.clr.hidden = !code; CP.valid(box, true); CP.close(box); },
  valid(box, ok){ const e = CP.els(box); e.msg.hidden = ok; e.q.classList.toggle('invalid', !ok); e.q.setAttribute('aria-invalid', String(!ok)); },
  settle(box){ const e = CP.els(box), t = e.q.value.trim();
    if(!t){ CP.choose(box, ''); return; }
    if(e.hid.value && t===countryName(e.hid.value)){ CP.close(box); return; }
    const c = countryFromText(t); if(c) CP.choose(box, c); else { e.hid.value = ''; e.clr.hidden = false; CP.close(box); CP.valid(box, false); } },
  invalidIn(form){ return [...form.querySelectorAll('.cpick')].find(b => { const e = CP.els(b); if(e.q.value.trim() && !e.hid.value){ CP.settle(b); return !e.hid.value; } return false; }); },
};
document.addEventListener('focusin', e => { if(e.target.classList?.contains('cpick-q')){ e.target.select?.(); CP.open(e.target.closest('.cpick')); } });
document.addEventListener('input', e => { if(!e.target.classList?.contains('cpick-q')) return; e.stopImmediatePropagation();
  const box = e.target.closest('.cpick'), el = CP.els(box); el.hid.value = ''; el.clr.hidden = !e.target.value; CP.valid(box, true); CP.open(box); }, true);
document.addEventListener('mousedown', e => { const li = e.target.closest?.('.cpick-list li[data-code]'); if(li){ e.preventDefault(); CP.choose(li.closest('.cpick'), li.dataset.code); } });
document.addEventListener('click', e => { const b = e.target.closest?.('[data-cpick-clear]'); if(b){ e.stopImmediatePropagation(); const box = b.closest('.cpick'); CP.choose(box, ''); CP.els(box).q.focus(); } }, true);
document.addEventListener('focusout', e => { if(!e.target.classList?.contains('cpick-q')) return; const box = e.target.closest('.cpick');
  setTimeout(() => { if(box.isConnected && !box.contains(document.activeElement)) CP.settle(box); }, 0); });
document.addEventListener('keydown', e => { if(!e.target.classList?.contains('cpick-q')) return;
  const box = e.target.closest('.cpick'), el = CP.els(box), opts = [...el.list.querySelectorAll('li[data-code]')], cur = opts.findIndex(o => o.classList.contains('active'));
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){ e.preventDefault(); if(el.list.hidden) CP.open(box); else CP.mark(box, cur + (e.key==='ArrowDown'?1:-1)); }
  else if(e.key==='Enter'){ if(!el.list.hidden){ e.preventDefault(); e.stopImmediatePropagation(); if(opts[cur]) CP.choose(box, opts[cur].dataset.code); else CP.settle(box); } }
  else if(e.key==='Escape'){ if(!el.list.hidden){ e.preventDefault(); e.stopImmediatePropagation(); CP.close(box); } }
}, true);

/* Item rows (samples and orders) */
const blankRow = kind => kind==='order' ? { code:'', qty:'', price:'' } : { code:'', qty:'' };
function rowsHTML(kind, rows, cur){
  const isO = kind==='order';
  const head = `<div class="irow ${isO?'o':'s'} irow-head"><span>Item code</span><span>Quantity</span>${isO ? '<span>Unit price</span><span style="text-align:right">Line total</span>' : ''}<span></span></div>`;
  const body = rows.map((r,i) => `<div class="irow ${isO?'o':'s'}" data-row="${i}">
    <input class="ic" id="ir-code-${i}" name="ir-code-${i}" value="${esc(r.code)}" placeholder="Item code" aria-label="Item code, row ${i+1}">
    <input id="ir-qty-${i}" name="ir-qty-${i}" type="number" min="1" step="any" value="${esc(r.qty)}" placeholder="pcs" aria-label="Quantity, row ${i+1}">
    ${isO ? `<input id="ir-price-${i}" name="ir-price-${i}" type="number" min="0" step="any" value="${esc(r.price)}" placeholder="0.0000" aria-label="Unit price, row ${i+1}">
    <span class="lt mono" data-lt="${i}">${cur && r.qty!=='' && r.price!=='' ? money(lineTotal(r,cur),cur) : '—'}</span>` : ''}
    <button type="button" class="x" data-act="delrow" data-arg="${i}" aria-label="Remove row ${i+1}" ${rows.length===1?'disabled':''}>${I.x}</button></div>`).join('');
  const total = isO ? `<div class="total-row"><span>Order total</span><span class="mono" id="order-total">${cur ? money(rows.reduce((s,r) => s + lineTotal(r,cur), 0), cur) : 'Select a currency'}</span></div>` : '';
  return `<div class="field full"><label>Items<span class="req">*</span> <span class="hint">at least one row</span></label><div class="irows">${head}${body}</div>
    <div><button type="button" class="btn btn-sm" data-act="addrow">${I.plus}Add item</button></div>${total}</div>`;
}
function readRows(form){
  return [...form.querySelectorAll('.irow[data-row]')].map(row => { const i = row.dataset.row, g = n => form.elements[`ir-${n}-${i}`]?.value ?? '';
    const r = { code:g('code'), qty:g('qty') }; if(form.elements[`ir-price-${i}`]) r.price = g('price'); return r; });
}
function validateRows(rows, withPrice){
  if(!rows.length) return 'Add at least one item.';
  for(let i = 0; i < rows.length; i++){ const r = rows[i], n = i+1;
    if(!String(r.code).trim()) return `Item row ${n}: item code is required.`;
    const q = Number(r.qty); if(r.qty==='' || !isFinite(q) || q<=0) return `Item row ${n}: quantity must be a positive number.`;
    if(withPrice){ const p = Number(r.price); if(r.price==='' || !isFinite(p) || p<0) return `Item row ${n}: unit price must be zero or more.`; }
  }
  return null;
}
function updateTotals(form){
  const cur = form.elements['f-currency']?.value, rows = readRows(form);
  rows.forEach((r,i) => { const el = form.querySelector(`[data-lt="${i}"]`); if(el) el.textContent = cur && r.qty!=='' && r.price!=='' ? money(lineTotal(r,cur),cur) : '—'; });
  const tot = form.querySelector('#order-total'); if(tot) tot.textContent = cur ? money(rows.reduce((s,r) => s + lineTotal(r,cur), 0), cur) : 'Select a currency';
}

            : field('f-opp','Related opportunity', sel('f-opp', aid ? DB.opps.filter(o => o.accountId===aid).map(o => [o.id, `${o.id} · ${o.name}`]) : [], v['f-opp'] ?? '', 'None'), {full:true})}
      ${field('f-desc','Description', ta('f-desc', v['f-desc']), {req:true, full:true})}
      ${field('f-status','Status', `<select id="f-status" name="f-status" data-act-change="probstatus">${opt(['Open','Resolved'], status)}</select>`)}
      ${field('f-solution','Solution', ta('f-solution', v['f-solution']), {req:status==='Resolved', full:true, hint: status==='Resolved' ? 'required to resolve' : 'optional while open'})}
    </div><div class="infobox">Responsibility sits with the account's sales team.</div>`;
    submit = 'Save problem';
  }
  if(type==='resolve'){
    const p = prob(args[0]); title = 'Resolve problem'; sub = `${p.id} · ${p.type} · ${acc(p.accountId).name}`;
    body = `<div class="infobox">${esc(p.description)}</div>${field('f-solution','Solution', ta('f-solution', v['f-solution'] ?? p.solution), {req:true, full:true, hint:'what was done to fix it'})}`;
    submit = 'Mark resolved';
  }
  if(type==='followup'){
    const a = acc(args[1]), t = team(a.teamId);
    title = 'Update next contact'; sub = `${a.name} · shared by ${t.name}`;
    body = `<div class="fields">${field('f-next','Next contact date', inp('f-next', v['f-next'] ?? a.nextContact, 'date'), {hint:'optional'})}
      ${field('f-action','Next action', inp('f-action', v['f-action'] ?? a.nextAction), {full:true, hint:'optional'})}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="faint" style="font-size:12px">Leave both blank to clear. Accounts without a date do not appear in follow-ups.</span><button type="button" class="btn btn-sm" data-act="clearnc">Clear both</button></div>`;
  }
  if(type==='account'){
    const a = acc(args[0]); title = 'Edit account'; sub = a.id;
    body = `<div class="fields">${field('f-name','Company name', inp('f-name', v['f-name'] ?? a.name), {req:true, full:true})}
      ${field('f-country-q','Country', countryPicker('f-country', v['f-country'] ?? a.country))}${field('f-phone','Company phone', inp('f-phone', v['f-phone'] ?? a.phone, 'tel'))}
      ${field('f-status','Account status', sel('f-status', ['Active','Inactive'], v['f-status'] ?? a.status, null))}
      ${fixedField('Account source', `${esc(a.source)} <span class="faint">(set at creation)</span>`, false)}
      ${fixedField('Assigned team', `${team(a.teamId).name} <span class="faint">(set by Management or on creation)</span>`)}
      ${field('f-notes','Notes', ta('f-notes', v['f-notes'] ?? a.notes), {full:true})}</div>`;
  }
  if(type==='reset'){
    title = 'Reset demo data?'; danger = true; submit = 'Reset demo data';
    sub = STORE.active ? 'Replaces your saved records with the original fictional demo data.' : 'Restores the original fictional demo data in this session.';
    body = `<div class="warnbox">Every lead, account, contact, opportunity, sample request, order and problem you added or changed will be replaced by the original demo records. This cannot be undone.</div>`;
  }
  if(type==='address'){
    const a = acc(args[0]); title = 'Add address'; sub = a.name;
    body = `<div class="fields">${field('f-type','Category', sel('f-type', ADDRESS_TYPES, v['f-type']), {req:true})}${field('f-text','Address', inp('f-text', v['f-text']), {req:true, full:true})}</div>`;
  }
  const pm = type.startsWith('pm-') ? peopleModal(type, args, v) : null;
  if(pm) ({ title, sub = '', body, submit, danger = false, wide = false } = pm);
  return `<div class="overlay" data-act="overlay"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <form data-form="${m.type}" novalidate>
      <div class="modal-head"><div><h2 id="m-title" style="font-size:16px">${esc(title)}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:''}</div><button type="button" class="x" data-act="close" aria-label="Close">${I.x}</button></div>
      <div class="modal-body">${body}${m.err ? `<div class="err" role="alert">${esc(m.err)}</div>` : ''}</div>
      <div class="modal-foot"><span class="proto">${isLive() ? 'Saved to Supabase' : STORE.active ? 'Saved to your private storage' : 'Demo mode: not saved after reload'}</span><button type="button" class="btn" data-act="close">${submit?'Cancel':'Close'}</button>${submit ? `<button type="submit" class="btn ${danger?'btn-danger':'btn-primary'}">${submit}</button>` : ''}</div>
    </form></div></div>`;
}

const req = (v, keys) => keys.every(k => String(v[k]||'').trim());
function validateLead(v){
  if(!req(v,['f-company','f-source'])) return 'Company name and source are required.';
  if(!String(v['f-email']||'').trim() && !String(v['f-phone']||'').trim()) return 'Add at least one contact method: email or phone.';
  return null;
}
function handleSubmit(formType, v, rows){
  const [type, ...args] = formType.split(':'), u = currentUser();
  const fail = msg => { S.modal = { ...S.modal, type:formType, v, rows, err:msg }; render(); };
  if(type==='lead'){
    const err = validateLead(v); if(err) return fail(err);
    const l = createLead(v), dup = duplicateOf(l.company);
    S.modal = null; toast(`Lead ${l.id} submitted to the Management queue.${dup ? ` Flagged: matches account ${dup.id}.` : ''}`); return render();
  }
  if(type==='leadview'){
    const l = lead(args[0]);
    if(canMgmtReassign(l)){
      if(!v['f-team']) return fail('Choose a sales team.');
      if(v['f-team']===l.teamId) return fail('Choose a different team to reassign this lead.');
      const from = l.teamId; Object.assign(l, { teamId:v['f-team'], assignedBy:u, assignedAt:TODAY_STR });
      l.history.push({ at:TODAY_STR, by:u, action:`Reassigned from ${team(from).name} to ${team(l.teamId).name}` });
      S.modal = null; toast(`${l.id} reassigned to ${team(l.teamId).name}.`); return render();
    }
    if(!canMgmtQualify(l) && !canSalesQualify(l)) return fail('You do not have permission to qualify or assign this lead.');
    if(!v.decision) return fail('Choose a decision.');
    const note = (v['f-assess']||'').trim();
    if(v.decision==='Duplicate'){
      if(!isM()) return fail('Only Management resolves duplicates.');
      const [t, tid] = (v['f-dupof']||'').split(':');
      if(!tid || (t==='account' ? !acc(tid) : !lead(tid) || tid===l.id)) return fail('Choose the existing account or lead this duplicates.');
      Object.assign(l, { status:'Duplicate', duplicateOf:{ type:t, id:tid }, assessment:note, resolvedBy:u, resolvedAt:TODAY_STR });
      l.history.push({ at:TODAY_STR, by:u, action:`Resolved as duplicate of ${t} ${tid}` });
      S.modal = null; toast(`${l.id} resolved as a duplicate of ${t} ${tid}. No account created.`); return render();
    }
    if(v.decision==='Qualified'){
      if(!note) return fail('Add a short assessment.');
      const dup = duplicateOf(l.company); if(dup) return fail(`Account ${dup.id} already exists for this company. Resolve this lead as a duplicate.`);
      if(isM()){
        if(!v['f-team']) return fail('Choose the sales team that will own the account.');
        Object.assign(l, { teamId:v['f-team'], assignedBy:u, assignedAt:TODAY_STR });
        l.history.push({ at:TODAY_STR, by:u, action:`Assigned to ${team(l.teamId).name}` });
      }
      const id = qualifyLead(l, note);
      S.modal = null; toast(`Qualified. Account ${id} created for ${team(l.teamId).name}.`); return render();
    }
    if(!NQ_REASONS.includes(v['f-reason'])) return fail('Choose a reason.');
    if(v['f-reason']==='Other' && !note) return fail('Explain the reason when Other is selected.');
    Object.assign(l, { status:'Not Qualified', reason:v['f-reason'], assessment:note, qualifiedBy:u, qualifiedAt:TODAY_STR });
    l.history.push({ at:TODAY_STR, by:u, action:`Not qualified: ${v['f-reason']}` });
    S.modal = null; toast(`${l.id} marked Not qualified (${v['f-reason']}).`); return render();
  }
  if(type==='newaccount'){
    if(!req(v,['f-company','f-source'])) return fail('Company name and account source are required.');
    const dup = duplicateOf(v['f-company']); if(dup) return fail(dupMessage('newaccount', v['f-company'].trim(), dup));
    const id = nextId('A', DB.accounts);
    DB.accounts.push({ id, name:v['f-company'].trim(), country:v['f-country'].trim(), phone:v['f-phone'].trim(), status:'Active', teamId:S.teamId, source:v['f-source'],
      createdBy:u, createdAt:TODAY_STR, addresses:[], notes:v['f-notes'].trim(), nextContact:'', nextAction:'', contacts:[] });
    S.modal = null; S.view = 'account'; S.id = id; S.tab = 'contacts'; toast(`Account ${id} created for ${team(S.teamId).name}.`); return render();
  }
  if(type==='opp'){
    if(!req(v,['f-name','f-date'])) return fail('Opportunity name and date are required.');
    const o = { id:nextId('O-', DB.opps), accountId:args[0], name:v['f-name'].trim(), date:v['f-date'], details:v['f-details'].trim(), status:'Open' };
    DB.opps.push(o); S.modal = null; S.view = 'opp'; S.id = o.id; toast(`Opportunity ${o.id} created.`); return render();
  }
  if(type==='lost'){
    if(!v['f-reason']) return fail('Choose a loss reason.');
    if(v['f-reason']==='Other' && !v['f-lossdetails'].trim()) return fail('Loss details are required when the reason is Other.');
    Object.assign(opp(args[0]), { status:'Lost', lossReason:v['f-reason'], lossDetails:v['f-lossdetails'].trim() });
    S.modal = null; toast(`${args[0]} marked Lost (${v['f-reason']}).`); return render();
  }
  if(type==='order'){
    if(!req(v,['f-code','f-currency','f-req','f-del'])) return fail('Order code, currency, request date and delivery date are required.');
    if(DB.orders.some(o => sameCode(o.code, v['f-code']))) return fail(`Order code ${v['f-code'].trim()} already exists.`);
    if(v['f-del'] < v['f-req']) return fail('Delivery date cannot be before the request date.');
    const rerr = validateRows(rows, true); if(rerr) return fail(rerr);
    const o = { code:v['f-code'].trim(), accountId:args[0], oppId:v['f-opp']||null, requestDate:v['f-req'], deliveryDate:v['f-del'], currency:v['f-currency'],
      items: rows.map(r => ({ code:r.code.trim(), qty:+r.qty, price:+r.price })), createdBy:u, createdAt:TODAY_STR };
    const won = recordOrder(o); S.modal = null;
    toast(`Order ${o.code} saved as confirmed, total ${money(orderTotal(o), o.currency)}.${won ? ` ${o.oppId} is now Won.` : ''}`); return render();
  }
  if(type==='sample'){
    if(opp(args[0]).status==='Lost') return fail('This opportunity is Lost. Create a new opportunity for new development.');
    if(!req(v,['f-code','f-req','f-del'])) return fail('Sample code, request date and delivery date are required.');
    if(DB.samples.some(s => sameCode(s.code, v['f-code']))) return fail(`Sample code ${v['f-code'].trim()} already exists.`);
    if(v['f-del'] < v['f-req']) return fail('Delivery date cannot be before the request date.');
    const rerr = validateRows(rows, false); if(rerr) return fail(rerr);
    DB.samples.push({ code:v['f-code'].trim(), oppId:args[0], requestDate:v['f-req'], deliveryDate:v['f-del'], items: rows.map(r => ({ code:r.code.trim(), qty:+r.qty })), createdBy:u, createdAt:TODAY_STR });
    S.modal = null; toast(`Sample request ${v['f-code'].trim()} recorded with ${rows.length} item${rows.length===1?'':'s'}.`); return render();
  }
  if(type==='contact'){
    if(!req(v,['f-name'])) return fail('Name is required.');
    acc(args[0]).contacts.push(C(v['f-name'].trim(), v['f-pos'].trim(), v['f-email'].trim(), v['f-num'].trim(), v['f-addr'].trim(), u, TODAY_STR));
    S.modal = null; S.tab = 'contacts'; toast('Contact added.'); return render();
  }
  if(type==='problem'){
    const aid = args[0] || v['f-acc'];
    if(!aid) return fail('Choose an account.');
    if(!req(v,['f-type','f-date','f-desc'])) return fail('Problem type, event date and description are required.');
    if(v['f-status']==='Resolved' && !v['f-solution'].trim()) return fail('Add a solution to save this problem as Resolved.');
    const p = { id:nextId('PR-', DB.problems), accountId:aid, oppId:v['f-opp']||null, type:v['f-type'], date:v['f-date'], description:v['f-desc'].trim(),
      solution:v['f-solution'].trim(), status:v['f-status'], createdBy:u, createdAt:TODAY_STR };
    if(p.status==='Resolved') Object.assign(p, { resolvedBy:u, resolvedAt:TODAY_STR });
    DB.problems.push(p); S.modal = null; if(S.view==='account') S.tab = 'problems'; toast(`Problem ${p.id} logged.`); return render();
  }
  if(type==='resolve'){
    if(!v['f-solution'].trim()) return fail('A solution is required to resolve the problem.');
    Object.assign(prob(args[0]), { status:'Resolved', solution:v['f-solution'].trim(), resolvedBy:u, resolvedAt:TODAY_STR });
    S.modal = null; toast(`${args[0]} resolved.`); return render();
  }
  if(type==='followup'){
    const nc = v['f-next'] || '', na = (v['f-action'] || '').trim();
    Object.assign(acc(args[1]), { nextContact:nc, nextAction:na });
    S.modal = null; toast(nc || na ? 'Next contact updated.' : 'Next contact cleared.'); return render();
  }
  if(type==='account'){
    if(!req(v,['f-name'])) return fail('Company name is required.');
    const dup = duplicateOf(v['f-name']); if(dup && dup.id!==args[0]) return fail(`Another account (${dup.id}) already uses this company name.`);
    Object.assign(acc(args[0]), { name:v['f-name'].trim(), country:v['f-country'].trim(), phone:v['f-phone'].trim(), status:v['f-status'], notes:v['f-notes'] });
    S.modal = null; toast('Account updated.'); return render();
  }
  if(type==='address'){
    if(!req(v,['f-type','f-text'])) return fail('Category and address are required.');
    acc(args[0]).addresses.push({ type:v['f-type'], text:v['f-text'].trim() });
    S.modal = null; toast('Address added.'); return render();
  }
}

/* ---------- 7. Rendering & events ---------- */
const VIEWS = { dashboard:viewDashboard, leads:viewLeads, accounts:viewAccounts, account:viewAccount, opps:viewOpps, opp:viewOpp, followups:viewFollowups, submit:viewSubmit,
  admin:viewAdmin, teams:viewTeams, myteam:viewMyTeam, profile:viewProfile };

function render(){
  hideTip();
  if(['login','forgot','setpw'].includes(MODE)){ document.getElementById('app').innerHTML = loginHTML(); document.getElementById('modal-root').innerHTML = ''; if(!document.activeElement || document.activeElement===document.body) document.getElementById('login-email')?.focus(); return; }
  const ae = document.activeElement, fid = ae && ae.id, pos = ae && ae.selectionStart;
  const allowed = NAV.filter(n => n.roles.includes(S.role)).map(n => n.id);
  if(!allowed.includes(S.view) && !(['account','opp'].includes(S.view) && S.role!=='submitter')) S.view = allowed[0];
  document.getElementById('app').innerHTML = shell(VIEWS[S.view]());
  document.getElementById('modal-root').innerHTML = S.view==='submit' ? '' : modalHTML();
  if(S.focus){ document.getElementById(S.focus)?.focus(); S.focus = null; return; }
  if(fid){ const el = document.getElementById(fid); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(e){} return; } }
  if(S.modal && S.modal.type!=='inline' && S.view!=='submit'){ document.querySelector('.modal input:not([type=hidden]):not([disabled]), .modal select, .modal textarea')?.focus(); }
}
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }

function formValues(form){ const v = {}; new FormData(form).forEach((val,k) => v[k] = String(val)); return v; }
const modalForm = () => document.querySelector('#modal-root form');
function keepForm(){ const f = modalForm(); if(f){ S.modal.v = formValues(f); if(f.querySelector('.irow[data-row]')) S.modal.rows = readRows(f); S.modal.err = null; } }

const ACT = {
  nav: arg => { S.view = arg; S.id = null; S.modal = null; window.scrollTo(0,0); render(); },
  open: arg => { const [k, id, tab] = arg.split(':'); S.modal = null;
    if(k==='account'){ S.view = 'account'; S.id = id; S.tab = tab || 'contacts'; } else { S.view = 'opp'; S.id = id; }
    window.scrollTo(0,0); render(); },
  tab: arg => { S.tab = arg; render(); },
  retrysave: () => persist(),
  demomode: () => startDemo(),
  tologin: () => { MODE = 'login'; SB.error = SB.client ? '' : SB.error; SB.info = ''; STORE.active = false; render(); },
  signout: () => sbSignOut(),
  reload: async () => { setStatus('saving'); try { await sbLoadAll(); setStatus('live'); } catch(e){ SB.error = friendlyError(e); setStatus('failed'); toast(SB.error); } render(); },
  toggle: arg => { S.open[arg] = !S.open[arg]; S.focus = null; render(); [...document.querySelectorAll('.code-toggle')].find(b => b.dataset.arg===arg)?.focus(); },
  modal: arg => { S.modal = { type:arg, v:{} }; render(); },
  close: () => { S.modal = null; render(); },
  overlay: (arg, el, e) => { if(e.target===el){ S.modal = null; render(); } },
  filter: arg => { const [path, val] = arg.split(':'); const [g,k] = path.split('.'); S.f[g][k] = val; render(); },
  addrow: () => { keepForm(); const kind = S.modal.type.startsWith('order') ? 'order' : 'sample';
    S.modal.rows = [...(S.modal.rows || []), blankRow(kind)]; S.focus = `ir-code-${S.modal.rows.length-1}`; render(); },
  clearnc: () => { ['f-next','f-action'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; }); },
  delrow: arg => { keepForm(); if(S.modal.rows.length>1) S.modal.rows.splice(+arg, 1); render(); },
  atab: arg => { S.atab = arg; render(); },
  pmemail: arg => { const [action, id] = arg.split(':'); sendAuthEmail(action, id); },
  forgot: () => { MODE = 'forgot'; SB.error = ''; SB.info = ''; render(); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  if(t.tagName==='SELECT' || t.tagName==='INPUT') return;
  e.stopPropagation(); ACT[t.dataset.act]?.(t.dataset.arg, t, e);
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && S.modal && S.view!=='submit'){ S.modal = null; render(); }
  if(e.key==='Enter' && (e.target.matches('tr.row') || e.target.matches('.li'))){ e.target.click(); }
});
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.filter;
  if(f && t.tagName==='INPUT'){ const [g,k] = f.split('.'); S.f[g][k] = t.value; render(); return; }
  const form = t.form; if(!form) return;
  if(t.id==='f-company'){ // live duplicate hint
    const name = t.value.trim(), dup = duplicateOf(name); let box = form.querySelector('[data-dup]');
    if(dup){ if(!box){ form.querySelector('.fields').insertAdjacentHTML('afterend','<div class="warnbox" data-dup></div>'); box = form.querySelector('[data-dup]'); } box.textContent = dupMessage(form.dataset.form, name, dup); }
    else box?.remove();
  }
  if(t.closest('.irow') && form.dataset.form.startsWith('order')) updateTotals(form);
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.filter && t.tagName==='SELECT'){ const [g,k] = t.dataset.filter.split('.'); S.f[g][k] = t.value; render(); return; }
  if(t.id==='f-currency' && t.form) { updateTotals(t.form); return; }
  const a = t.dataset.actChange;
  if(a==='role'){ S.role = t.value; S.modal = null; S.view = { submitter:'submit', admin:'admin' }[t.value] || 'dashboard'; S.id = null; S.f.leads.status = '';
    if(t.value==='sales'){ const mg = teamMembers(S.teamId).find(p => p.role==='sales_manager') || teamMembers(S.teamId)[0]; S.member = String(mg?.id || ''); } render(); }
  if(a==='team'){ S.teamId = t.value; S.modal = null; if(['account','opp'].includes(S.view)) S.view = 'dashboard';
    const mg = teamMembers(S.teamId).find(p => p.role==='sales_manager') || teamMembers(S.teamId)[0]; S.member = String(mg?.id || ''); render(); }
  if(a==='member'){ S.member = t.value; render(); }
  if(['decision','lossreason','probstatus','probacc','pmrole'].includes(a)){ keepForm(); if(a==='probacc') S.modal.v['f-opp'] = ''; render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const form = e.target, type = form.dataset.form;
  if(form.id==='forgot-form'){ const em = formValues(form).email.trim(); if(!em){ SB.error = 'Enter your email.'; render(); return; } sbForgot(em); return; }
  if(form.id==='setpw-form'){ const v = formValues(form); sbSetPassword(v.pw1, v.pw2); return; }
  if(type && type.startsWith('pm-')){ peopleSubmit(type, formValues(form)); return; }
  if(form.id==='login-form'){ const v = formValues(form); if(!v.email.trim() || !v.password){ SB.error = 'Enter your email and password.'; render(); return; } sbSignIn(v.email.trim(), v.password); return; }
  if(isLive()){
    if(SB.busy){ toast('Still saving the previous change. Try again in a moment.'); return; }
    if(type==='reset') return;
  }
  const before = isLive() ? clone(Object.fromEntries(TABLES.map(t => [t, DB[t]]))) : null;
  const afterChange = () => { if(!isLive()) return persist(); if(TABLES.some(t => JSON.stringify(DB[t]) !== JSON.stringify(before[t]))) sbSync(before); };
  if(!isLive() && STORE.status==='connecting'){ toast('Loading your saved data. Try again in a moment.'); return; }
  if(type==='reset'){ resetDemoData(); return; }
  const badCountry = CP.invalidIn(form);
  if(badCountry){ CP.valid(badCountry, false); CP.els(badCountry).q.focus(); return; }
  const v = formValues(form);
  const rows = form.querySelector('.irow[data-row]') ? readRows(form) : null;
  if(S.view==='submit' && type==='lead'){
    const err = validateLead(v);
    if(err){ S.modal = { type:'inline', v, err }; render(); return; }
    const l = createLead(v), dup = duplicateOf(l.company);
    S.modal = null; render(); toast(`Lead ${l.id} submitted to the Management queue.${dup ? ` Flagged: matches account ${dup.id}.` : ''}`); afterChange(); return;
  }
  handleSubmit(type, v, rows);
  afterChange();   // demo: private storage; live: Supabase. A failed validation changes nothing, so nothing is written
});

/* Account Acquisition tooltip: hover (mouse), tap (touch) or keyboard focus on a source bar.
   Values come from the row's data attributes, which are computed from the account records at render. */
const TIP = { el:null, row:null, pinned:false, lastPointer:'mouse' };
function tipEl(){ if(!TIP.el){ TIP.el = document.createElement('div'); TIP.el.className = 'chart-tip'; TIP.el.id = 'acq-tip'; TIP.el.setAttribute('role','tooltip'); TIP.el.hidden = true; document.body.appendChild(TIP.el); } return TIP.el; }
function showTip(row, x, y){
  const t = tipEl(), d = row.dataset;
  if(TIP.row !== row){
    t.innerHTML = `<div class="tip-h">${esc(d.src)}</div>
      <div class="tip-r"><i style="background:var(--accent)"></i><span>Via Management-qualified lead</span><b>${d.lead}</b></div>
      <div class="tip-r"><i style="background:var(--line-strong)"></i><span>Created directly by Sales</span><b>${d.direct}</b></div>
      <div class="tip-r tot"><span>Total accounts</span><b>${d.total}</b></div>`;
    TIP.row?.removeAttribute('aria-describedby'); TIP.row = row; row.setAttribute('aria-describedby','acq-tip');
  }
  t.hidden = false;
  const r = t.getBoundingClientRect(), pad = 8;   // keep inside the viewport (fixed position, so no container can clip it)
  let left = x + 14, top = y + 14;
  if(left + r.width > innerWidth - pad) left = x - r.width - 14;
  if(left < pad) left = pad;

}

/* ---------- 8. Private persistent storage ----------
   Each signed-in viewer who may save (the owner, or organization members shared as Contributor or above)
   gets a private copy at data/users/<their id>/<table>. Nobody else can read it, the artifact owner included.
   Everyone else uses the in-memory demo (changes reset on reload). Nothing is ever written to shared paths. */
const TABLES = ['leads','accounts','opps','samples','orders','problems'];   // contacts live inside accounts, history inside leads
const SCHEMA = 1;
const clone = x => JSON.parse(JSON.stringify(x));
const SEED = clone(Object.fromEntries(TABLES.map(t => [t, DB[t]])));        // the fictional demo data, captured before any edit
const STORE = { active:false, status:'connecting', db:null, uid:null, last:{}, savedAt:null, error:'' };

function saveStatusHTML(){

  if(isLive()){
    const lb = { live:`Synced with Supabase${SB.syncedAt ? ' · ' + SB.syncedAt : ''}`, saving:'Saving to Supabase…', failed:'Last change not saved' }[st] || 'Connected';
    return `<span class="save-pill s-${st}" role="status">${esc(lb)}</span><button type="button" class="btn btn-sm" data-act="reload">Refresh</button>`;
  }
  const label = { connecting:'Loading saved data…', saving:'Saving…', saved:`Saved${STORE.savedAt ? ' · ' + STORE.savedAt : ''}`, failed:'Save failed', demo:'Demo mode: changes are not saved', loadfail:'Saved data could not be loaded. Saving is paused.' }[st];
  return `<span class="save-pill s-${st}" role="status">${esc(label)}</span>`
    + (st==='failed' ? `<button type="button" class="btn-link" data-act="retrysave">Retry</button>` : '')
    + `<button type="button" class="btn btn-sm" data-act="modal" data-arg="reset">Reset demo data</button>`;
}
function setStatus(st, err=''){
  STORE.status = st; STORE.error = err;
  if(st==='saved'){ const d = new Date(); STORE.savedAt = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  const el = document.getElementById('save-status'); if(el) el.innerHTML = saveStatusHTML();
}
const tableRef = t => STORE.db.doc(`data/users/${STORE.uid}/${t}`);
async function withRetry(fn){ try { return await fn(); } catch(e){ if(e && e.code==='unavailable'){ await new Promise(r => setTimeout(r, 400 + Math.random()*600)); return fn(); } throw e; } }

async function initStorage(){
  let db = null, user = null, uid = null;
  try { if(window.claude?.use) [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch(e){}
  try { uid = user ? await user.id() : null; } catch(e){}
  if(!db || !uid){ setStatus('demo'); return; }
  STORE.db = db; STORE.uid = uid;
  // 1. Read everything first. Never write before we know what is saved.
  let snaps;
  try { snaps = await withRetry(() => Promise.all([...TABLES, 'meta'].map(t => tableRef(t).get()))); }
  catch(e){ setStatus('loadfail'); console.warn('Load failed', e); return; }   // do not seed: it could overwrite saved records
  const byName = Object.fromEntries([...TABLES, 'meta'].map((t,i) => [t, snaps[i]]));
  const hasSaved = [...TABLES, 'meta'].some(t => byName[t].exists);
  if(hasSaved){
    TABLES.forEach(t => { const d = byName[t].exists ? byName[t].data() : null;
      if(d && Array.isArray(d.rows)){ DB[t] = clone(d.rows); STORE.last[t] = JSON.stringify(DB[t]); } });
    // A table that was never saved (interrupted first save) keeps the demo rows and is written below; existing tables are untouched.
    STORE.active = true; S.modal = null; render();
    const missing = TABLES.filter(t => !(t in STORE.last));
    if(missing.length) await persist(); else setStatus('saved');
    return;
  }
  // 2. Nothing saved yet: copy the demo data into this viewer's private area.
  STORE.active = true;
  try {
    for(const t of TABLES){ const body = JSON.stringify(DB[t]); await tableRef(t).set({ rows: JSON.parse(body), schema: SCHEMA, savedAt: new Date().toISOString() }); STORE.last[t] = body; }
    await tableRef('meta').set({ schema: SCHEMA, seededAt: new Date().toISOString() });
    setStatus('saved');
  } catch(e){
    STORE.active = false;
    setStatus(e && e.code==='invalid_argument' ? 'demo' : 'failed', e?.code || '');   // view-only members cannot write: run as demo
  }
}

let saving = false, saveAgain = false;
async function persist(){
  if(!STORE.active) return;
  if(saving){ saveAgain = true; return; }
  saving = true;
  try {
    do {
      saveAgain = false;
      const changed = TABLES.filter(t => JSON.stringify(DB[t]) !== STORE.last[t]);
      if(!changed.length){ if(STORE.status!=='failed') setStatus('saved'); break; }
      setStatus('saving');
      for(const t of changed){
        const body = JSON.stringify(DB[t]);
        if(body.length > 240 * 1024) throw { code:'too_large', message:`${t} is too large to save` };
        await withRetry(() => tableRef(t).set({ rows: JSON.parse(body), schema: SCHEMA, savedAt: new Date().toISOString() }));
        STORE.last[t] = body;
      }
      setStatus('saved');
    } while(saveAgain);
  } catch(e){ console.warn('Save failed', e); setStatus('failed', e?.code || ''); }
  saving = false;
}
function resetDemoData(){
  TABLES.forEach(t => DB[t] = clone(SEED[t]));
  S.open = {}; S.modal = null; S.view = S.role==='submitter' ? 'submit' : 'dashboard'; S.id = null;
  render(); toast(STORE.active ? 'Demo data restored. Saving…' : 'Demo data restored.');
  persist();
}
