/* ----- Write the changes one form submit made (compare before / after) ----- */
async function sbPush(B){
  const c = SB.client, me = SB.me.user_id, today = TODAY_STR, idMap = {};
  const ins = async (table, row, key) => (await q(c.from(table).insert(row).select(key).single()))[key];
  const upd = (table, patch, key, id) => q(c.from(table).update(patch).eq(key, id));
  const rpc = (fn, args) => q(c.rpc(fn, args));
  const mapId = id => idMap[id] || id;
  const by = (arr, k='id') => Object.fromEntries(arr.map(x => [x[k], x]));

  // Leads: created and decided only through the database functions
  const bL = by(B.leads);
  for(const l of DB.leads){
    const o = bL[l.id];
    if(!o){
      await rpc('submit_lead', { p_company_name:l.company, p_normalized_name:norm(l.company), p_source:l.source, p_country_code:l.country || null,
        p_contact_name:l.contactName || null, p_email:l.email || null, p_phone:l.phone || null, p_needs:l.needs || null });
      continue;
    }
    if(l.status==='Pending Qualification' && o.status==='Pending Qualification' && l.teamId!==o.teamId)
      throw new Error('Reassigning a pending lead is not available in the connected version. Qualify it and choose the team instead.');
    if(o.status==='Pending Qualification' && l.status!=='Pending Qualification'){
      if(l.status==='Qualified'){ const acc = await rpc('qualify_lead', { p_lead_id:l.id, p_team_id:l.teamId, p_assessment:l.assessment, p_normalized_name:norm(l.company) }); if(l.accountId) idMap[l.accountId] = acc; }
      else if(l.status==='Not Qualified') await rpc('not_qualify_lead', { p_lead_id:l.id, p_reason:l.reason, p_comment:l.assessment || null });
      else if(l.status==='Duplicate') await rpc('resolve_lead_duplicate', { p_lead_id:l.id,
        p_account_id: l.duplicateOf?.type==='account' ? l.duplicateOf.id : null, p_duplicate_lead_id: l.duplicateOf?.type==='lead' ? l.duplicateOf.id : null, p_comment:l.assessment || null });
    }
  }
  // Accounts (Path B direct creation, edits, next contact) with their addresses and contacts
  const bA = by(B.accounts);
  for(const a of DB.accounts){
    const o = bA[a.id];
    if(!o){
      if(a.leadId) continue;   // created by qualify_lead above
      idMap[a.id] = await ins('accounts', { company_name:a.name, normalized_name:norm(a.name), country_code:a.country || null, phone:a.phone || null, status:a.status,
        team_id:a.teamId, source:a.source, notes:a.notes || null, next_contact_date:a.nextContact || null, next_action:a.nextAction || null,
        created_by_user_id:me, created_date:a.createdAt || today }, 'account_id');
    } else {
      const patch = {};
      if(a.name!==o.name){ patch.company_name = a.name; patch.normalized_name = norm(a.name); }
      if(a.country!==o.country) patch.country_code = a.country || null;
      if(a.phone!==o.phone) patch.phone = a.phone || null;
      if(a.status!==o.status) patch.status = a.status;
      if(a.notes!==o.notes) patch.notes = a.notes || null;
      if(a.nextContact!==o.nextContact) patch.next_contact_date = a.nextContact || null;
      if(a.nextAction!==o.nextAction) patch.next_action = a.nextAction || null;
      if(Object.keys(patch).length) await upd('accounts', patch, 'account_id', a.id);
    }
    const prevAddr = o ? o.addresses.length : 0, prevCont = o ? o.contacts.length : 0, accId = mapId(a.id);
    const newAddr = a.addresses.slice(prevAddr).map((x, i) => ({ account_id:accId, address_type:x.type, address_text:x.text, sort_order:prevAddr + i + 1 }));
    if(newAddr.length) await q(c.from('account_addresses').insert(newAddr));
    const newCont = a.contacts.slice(prevCont).map(x => ({ account_id:accId, contact_name:x.name, position:x.position || null, email:x.email || null,
      phone:x.number || null, address:x.address || null, created_by_user_id:me, created_date:x.createdAt || today }));
    if(newCont.length && !(o === undefined && a.leadId)) await q(c.from('contacts').insert(newCont));
  }
  // Opportunities: create, lose (Won is set by the database when a linked order is saved)
  const bO = by(B.opps);
  for(const op of DB.opps){
    const o = bO[op.id];
    if(!o){ idMap[op.id] = await ins('opportunities', { account_id:mapId(op.accountId), opportunity_name:op.name, opportunity_date:op.date, details:op.details || null }, 'opportunity_id'); continue; }
    if(op.status==='Lost' && o.status!=='Lost') await upd('opportunities', { status:'Lost', loss_reason:op.lossReason, loss_details:op.lossDetails || null }, 'opportunity_id', op.id);
  }
  // Sample requests with item lines
  const bS = new Set(B.samples.map(s => s.code.toLowerCase()));
  for(const s of DB.samples.filter(s => !bS.has(s.code.toLowerCase()))){
    const id = await ins('sample_requests', { sample_code:s.code, opportunity_id:mapId(s.oppId), request_date:s.requestDate, delivery_date:s.deliveryDate, created_by_user_id:me, created_date:today }, 'sample_request_id');
    await q(c.from('sample_request_items').insert(s.items.map((it, i) => ({ sample_request_id:id, line_no:i + 1, item_code:it.code, quantity:Number(it.qty) }))));
  }
  // Orders with item lines (saving = confirmed; the database marks a linked Open opportunity Won)
  const bR = new Set(B.orders.map(o => o.code.toLowerCase()));
  for(const o of DB.orders.filter(o => !bR.has(o.code.toLowerCase()))){
    const id = await ins('orders', { order_code:o.code, account_id:mapId(o.accountId), opportunity_id:o.oppId ? mapId(o.oppId) : null, request_date:o.requestDate,
      delivery_date:o.deliveryDate, currency_code:o.currency, created_by_user_id:me, created_date:today }, 'order_id');
    await q(c.from('order_items').insert(o.items.map((it, i) => ({ order_id:id, line_no:i + 1, item_code:it.code, quantity:Number(it.qty), unit_price:Number(it.price) }))));
  }
  // Problems: log, resolve
  const bP = by(B.problems);
  for(const p of DB.problems){
    const o = bP[p.id], resolved = p.status==='Resolved';
    if(!o){ idMap[p.id] = await ins('problems', { account_id:mapId(p.accountId), opportunity_id:p.oppId ? mapId(p.oppId) : null, problem_type:p.type, event_date:p.date,
      description:p.description, solution:p.solution || null, status:p.status, created_by_user_id:me, created_date:today,
      resolved_by_user_id: resolved ? me : null, resolved_date: resolved ? today : null }, 'problem_id'); continue; }
    if(resolved && o.status!=='Resolved') await upd('problems', { status:'Resolved', solution:p.solution, resolved_by_user_id:me, resolved_date:today }, 'problem_id', p.id);
  }
  return idMap;
}

async function sbSync(before){
  SB.busy = true; setStatus('saving');
  try {
    const idMap = await sbPush(before);
    await sbLoadAll();
    if(S.id && idMap[S.id]) S.id = idMap[S.id];
    SB.busy = false; setStatus('live'); render();
  } catch(e){
    console.warn('Supabase save failed', e);
    SB.error = friendlyError(e); SB.busy = false;
    try { await sbLoadAll(); } catch(_){}   // show what the database really holds
    setStatus('failed'); render(); toast(`Not saved: ${SB.error}`);
  }
}

const AUTH_LINK = (() => { try { const h = new URLSearchParams(location.hash.slice(1)); return { type:h.get('type') || '', error:h.get('error_description') || h.get('error') || '' }; } catch(e){ return { type:'', error:'' }; } })();
const isFileUrl = () => location.protocol === 'file:';

    <div class="field"><label for="setpw-2">Repeat new password</label><input id="setpw-2" name="pw2" type="password" autocomplete="new-password" required></div>
    ${err}<button class="btn btn-primary login-btn" type="submit" id="setpw-submit">Save password and continue</button></form></div>`;
  return `<div class="login-wrap"><form class="login-card" id="login-form" novalidate>${BRAND_HTML}

    <div class="field"><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="username" required></div>

}
async function sbSignIn(email, password){
  SB.error = ''; SB.info = ''; const btn = document.getElementById('login-submit'); if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
  try {
    const { data, error } = await SB.client.auth.signInWithPassword({ email, password });
    if(error) throw error;
    await sbConnect(data.session);
  } catch(e){
    SB.error = /invalid login|invalid credentials/i.test(e.message || '') ? 'Email or password is incorrect.' : friendlyError(e);
    MODE = 'login'; render();
  }
}
async function sbForgot(email){
  SB.error = ''; SB.info = '';
  const btn = document.getElementById('forgot-submit'); if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
  const { error } = await SB.client.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
  if(error && !/rate|seconds/i.test(error.message)) SB.error = friendlyError(error);
  else if(error) SB.error = 'Please wait a minute before asking for another link.';
  else SB.info = 'If this email belongs to a CRM account, a reset link is on its way. Check your inbox.';
  render();
}
async function sbSetPassword(pw1, pw2){
  SB.error = '';
  if(pw1.length < 8){ SB.error = 'Use at least 8 characters.'; return render(); }
  if(pw1 !== pw2){ SB.error = 'The two passwords do not match.'; return render(); }
  const { error } = await SB.client.auth.updateUser({ password:pw1 });
  if(error){ SB.error = friendlyError(error); return render(); }
  history.replaceState(null, '', location.pathname + location.search);
  const { data } = await SB.client.auth.getSession();
  await sbConnect(data.session);
  if(isLive()) toast('Password saved.');
}
async function sbConnect(session){
  const signOutWith = async msg => { await SB.client.auth.signOut(); SB.error = msg; MODE = 'login'; render(); };
  const me = await q(SB.client.from('users').select('user_id,full_name,email,role_id,account_status').eq('auth_user_id', session.user.id).maybeSingle());
  if(!me || me.role_id==='system_intake')
    return signOutWith('You are signed in to Supabase, but this email is not linked to a CRM user. Ask your administrator to add you with the same email.');
  if(me.account_status==='Inactive') return signOutWith('Your CRM account is inactive. Ask your administrator if you need access again.');
  try { await SB.client.rpc('record_login'); } catch(e){}
  const mt = await q(SB.client.from('team_memberships').select('team_id').eq('user_id', me.user_id).eq('membership_status','Active').maybeSingle());
  const role = { admin:'admin', management:'mgmt', lead_submitter:'submitter' }[me.role_id] || 'sales';
  if(role==='sales' && !mt) return signOutWith('You are not assigned to a sales team yet. Ask your administrator.');
  SB.me = { ...me, team_id:mt?.team_id || null }; SB.meU = U(me.full_name, DB_ROLE_LABEL[me.role_id]);
  S.role = role; S.teamId = mt?.team_id || 'T1'; S.member = String(me.user_id);
  S.view = role==='submitter' ? 'submit' : role==='admin' ? 'admin' : 'dashboard'; S.id = null; S.modal = null; S.open = {};
  await sbLoadAll();
  MODE = 'supabase'; STORE.active = false; setStatus('live'); render();
}
async function sbSignOut(){
  try { await SB.client.auth.signOut(); } catch(e){}
  SB.me = null; SB.meU = null; SB.error = ''; SB.info = ''; MODE = 'login'; S.modal = null; document.getElementById('toast').hidden = true;
  TABLES.forEach(t => DB[t] = clone(SEED[t])); resetDemoPeople();
  render();
}
function startDemo(){
  MODE = 'demo'; SB.error = ''; SB.info = '';
  TABLES.forEach(t => DB[t] = clone(SEED[t])); resetDemoPeople();
  S.role = 'mgmt'; S.teamId = 'T1'; S.member = '4'; S.view = 'dashboard'; S.modal = null;
  render(); initStorage();
}

async function boot(){
  if(!window.supabase?.createClient){
    SB.error = 'The Supabase library could not load (check your internet connection). You can still explore the demo.';
    MODE = 'login'; render(); return;
  }
  SB.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  SB.client.auth.onAuthStateChange((event, session) => {
    if(event==='PASSWORD_RECOVERY'){ SB.pendingEmail = session?.user?.email || ''; MODE = 'setpw'; setTimeout(render); }
  });
  if(AUTH_LINK.error) SB.error = 'This link is invalid or has expired. Ask your administrator for a new invitation, or use Forgot password.';
  render();   // sign-in screen first
  try {
    const { data } = await SB.client.auth.getSession();
    if(data?.session && ['invite','recovery'].includes(AUTH_LINK.type)){ SB.pendingEmail = data.session.user.email || ''; MODE = 'setpw'; render(); return; }
    if(data?.session && MODE!=='setpw') await sbConnect(data.session);
  } catch(e){ SB.error = friendlyError(e); render(); }
}

  DB.teams = clone(DEMO_TEAMS).map(t => ({ ...t, status:t.status || 'Active' }));
  rebuildTeams();
}
const person = id => DB.people.find(p => p.id===+id);
const personTeam = id => DB.memberships.find(m => m.userId===+id && m.status==='Active')?.teamId || '';
const teamMembers = tid => DB.memberships.filter(m => m.teamId===tid && m.status==='Active').map(m => person(m.userId)).filter(Boolean);
function rebuildTeams(){
  DB.people.forEach(p => p.teamId = personTeam(p.id));
  DB.teams.forEach(t => { const ms = teamMembers(t.id);
    t.manager = ms.find(p => p.role==='sales_manager')?.name || '(no manager)';
    t.executives = ms.filter(p => p.role==='sales_executive').map(p => p.name); });
}
const teamPeopleText = t => [t.manager, ...(t.executives||[])].filter(Boolean).join(' · ');
const peopleShareText = t => { const ex = t.executives||[];
  return ex.length ? `${t.manager} (Sales Manager) and ${ex.join(', ')} (Sales Executive${ex.length>1?'s':''})` : `${t.manager} (Sales Manager)`; };
const nowISO = () => { const d = new Date(), p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const fdt = s => { if(!s) return '—'; const d = new Date(String(s).length<=10 ? s+'T00:00:00' : s); if(isNaN(d)) return '—';
  return `${String(d.getDate()).padStart(2,'0')} ${MON[d.getMonth()]} ${d.getFullYear()}${String(s).length>10 ? `, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : ''}`; };

/* ----- Demo implementations (same rules as the database functions) ----- */
const DEMO = {
  log(action, entity, entityId, details){ DB.audit.push({ id:DB.audit.length+1, userId:meId(), action, entity, entityId:String(entityId), details, at:nowISO() }); },
  start(uid, tid){ if(personTeam(uid)===tid) return; DEMO.end(uid);
    const m = { id:DB.memberships.length+1, userId:+uid, teamId:tid, status:'Active', start:TODAY_STR, end:'' }; DB.memberships.push(m);
    DEMO.log('membership.started','membership',m.id,{ user_id:+uid, team_id:tid }); },
  end(uid){ DB.memberships.filter(m => m.userId===+uid && m.status==='Active').forEach(m => { m.status = 'Ended'; m.end = TODAY_STR;
    DEMO.log('membership.ended','membership',m.id,{ user_id:+uid, team_id:m.teamId }); }); },
  activeTeam(tid){ if(!tid) throw new Error('Choose a sales team.'); if(team(tid)?.status!=='Active') throw new Error(`Team ${tid} does not exist or is inactive.`); },
  oneManager(tid, uid){ if(teamMembers(tid).some(p => p.role==='sales_manager' && p.id!==+uid)) throw new Error('A sales team can have only one Sales Manager.'); },
  set(p, patch, action){ const diff = {}; Object.entries(patch).forEach(([k,v]) => { if(p[k]!==v){ diff[{name:'full_name',role:'role_id',status:'account_status',jobTitle:'job_title'}[k]||k] = { from:p[k], to:v }; p[k] = v; } });
    if(Object.keys(diff).length) DEMO.log(action || (diff.account_status ? 'user.status_changed' : diff.role_id ? 'user.role_changed' : 'user.updated'), 'user', p.id, diff); },
  createUser({ name, email, role, teamId, jobTitle }){
    if(!name || !email) throw new Error('Name and work email are required.');
    if(DB.people.some(p => p.email.toLowerCase()===email.toLowerCase())) throw new Error('A user with this email already exists.');
    if(isSalesRole(role)){ DEMO.activeTeam(teamId); if(role==='sales_manager') DEMO.oneManager(teamId); } else teamId = '';
    const p = { id:Math.max(...DB.people.map(x => x.id))+1, name, email:email.toLowerCase(), role, status:'Invited', jobTitle:jobTitle||'', createdAt:TODAY_STR, lastLogin:'' };
    DB.people.push(p); DEMO.log('user.created','user',p.id,{ full_name:name, email:p.email, role_id:role, account_status:'Invited' });
    if(teamId) DEMO.start(p.id, teamId); return p.id; },
  changeRole(uid, role, teamId){ const p = person(uid); if(+uid===meId()) throw new Error('You cannot change your own role.');
    if(isSalesRole(role) && p.status!=='Inactive'){ teamId = teamId || personTeam(uid); DEMO.activeTeam(teamId); if(role==='sales_manager') DEMO.oneManager(teamId, uid); DEMO.start(uid, teamId); }
    else DEMO.end(uid);
    DEMO.set(p, { role }); },
  setStatus(uid, status, teamId){ const p = person(uid); if(+uid===meId()) throw new Error('You cannot change your own status.');
    if(status==='Inactive'){ if(p.status==='Inactive') return; DEMO.end(uid); DEMO.set(p, { status:'Inactive' }); return; }
    if(p.status!=='Inactive') return;
    if(isSalesRole(p.role)){ DEMO.activeTeam(teamId); if(p.role==='sales_manager') DEMO.oneManager(teamId, uid); DEMO.start(uid, teamId); }
    DEMO.set(p, { status: p.lastLogin ? 'Active' : 'Invited' }); },
  transfer(uid, tid){ const cur = personTeam(uid); if(!cur) throw new Error('Only active Sales Managers and Sales Executives can be transferred.');
    if(cur===tid) throw new Error('This person is already in that team.'); DEMO.activeTeam(tid); if(person(uid).role==='sales_manager') DEMO.oneManager(tid, uid); DEMO.start(uid, tid); },
  updateUser(uid, { name, jobTitle, phone }){ if(!name) throw new Error('Name is required.'); DEMO.set(person(uid), { name, jobTitle, phone }); },
  createTeam(id, name){ id = String(id||'').trim().toUpperCase(); if(!/^[A-Z0-9-]{1,10}$/.test(id)) throw new Error('Team code: up to 10 letters, numbers or dashes (for example T4).');
    if(!name) throw new Error('Team name is required.'); if(team(id)) throw new Error(`Team code ${id} is already used.`);
    if(DB.teams.some(t => t.name.toLowerCase()===name.toLowerCase())) throw new Error('Another team already has this name.');
    DB.teams.push({ id, name, status:'Active' }); DEMO.log('team.created','team',id,{ team_name:name }); },
  renameTeam(id, name){ if(!name) throw new Error('Team name is required.'); const t = team(id); if(t.name===name) return;
    DEMO.log('team.updated','team',id,{ team_name:{ from:t.name, to:name } }); t.name = name; },
  setTeamStatus(id, status){ const t = team(id); if(t.status===status) return;
    if(status==='Inactive'){ if(teamMembers(id).length) throw new Error('Move or remove the team\'s members before deactivating it.');
      if(DB.accounts.some(a => a.teamId===id && a.status==='Active')) throw new Error('This team still owns active accounts. Deactivate or reassign them first.'); }
    DEMO.log('team.status_changed','team',id,{ team_status:{ from:t.status, to:status } }); t.status = status; },
  request({ type, name, email, targetId, toTeamId, note }){
    const tid = personTeam(meId()); if(!isMgr() || !tid) throw new Error('Only a Sales Manager can request changes to their team.');
    let q;
    if(type==='Add'){ if(!name || !email) throw new Error('Employee name and work email are required.');
      if(teamMembers(tid).some(p => p.email.toLowerCase()===email.toLowerCase())) throw new Error('This person is already in your team.');
      if(DB.requests.some(r => r.status==='Pending' && r.type==='Add' && r.email.toLowerCase()===email.toLowerCase())) throw new Error('A request for this email is already pending.');
      q = { type, name, email:email.toLowerCase(), targetId:null, teamId:tid, fromTeamId:null };
    } else { const t = person(targetId);
      if(!t || t.role!=='sales_executive' || personTeam(t.id)!==tid) throw new Error('Choose a Sales Executive from your team.');
      if(DB.requests.some(r => r.status==='Pending' && r.targetId===t.id)) throw new Error('A request for this person is already pending.');
      if(type==='Transfer'){ DEMO.activeTeam(toTeamId); if(toTeamId===tid) throw new Error('Choose a different team.'); }
      q = { type, name:t.name, email:t.email, targetId:t.id, teamId: type==='Transfer' ? toTeamId : tid, fromTeamId:tid }; }
    Object.assign(q, { id:Math.max(0, ...DB.requests.map(r => r.id))+1, note:note||'', by:meId(), reviewer:null, status:'Pending', reason:'', resultId:null, createdAt:nowISO(), reviewedAt:'' });
    DB.requests.push(q); DEMO.log('request.submitted','access_request',q.id,{ request_type:type, team_id:q.teamId }); return q.id; },
  review(id, approve, reason){ const q = DB.requests.find(r => r.id===+id);
    if(q.status!=='Pending') throw new Error(`Request ${id} has already been ${q.status.toLowerCase()}.`);
    if(!approve){ if(!reason) throw new Error('Give a reason for the rejection.');
      Object.assign(q, { status:'Rejected', reason, reviewer:meId(), reviewedAt:nowISO() }); DEMO.log('request.rejected','access_request',q.id,{ request_type:q.type, team_id:q.teamId }); return null; }
    let pid;
    if(q.type==='Add'){ DEMO.activeTeam(q.teamId); const ex = DB.people.find(p => p.email.toLowerCase()===q.email.toLowerCase());
      if(!ex) pid = DEMO.createUser({ name:q.name, email:q.email, role:'sales_executive', teamId:q.teamId });
      else { if(!['sales_executive','lead_submitter'].includes(ex.role)) throw new Error(`${ex.name} is already a ${ROLE_NAMES[ex.role]}. Change the role in User Management instead.`);
        if(ex.status!=='Inactive' && personTeam(ex.id)===q.teamId) throw new Error(`${ex.name} is already in this team.`);
        DEMO.start(ex.id, q.teamId); DEMO.set(ex, { role:'sales_executive', status: ex.status!=='Inactive' ? ex.status : ex.lastLogin ? 'Active' : 'Invited' }); pid = ex.id; }
    } else { pid = q.targetId;
      if(personTeam(pid)!==q.fromTeamId || person(pid).role!=='sales_executive') throw new Error('This person is no longer a Sales Executive in the requesting team. Reject the request.');
      if(q.type==='Remove'){ DEMO.end(pid); DEMO.set(person(pid), { status:'Inactive' }); } else { DEMO.activeTeam(q.teamId); DEMO.start(pid, q.teamId); } }
    Object.assign(q, { status:'Approved', reviewer:meId(), reviewedAt:nowISO(), resultId:pid }); DEMO.log('request.approved','access_request',q.id,{ request_type:q.type, team_id:q.teamId }); return pid; },
  profile({ name, jobTitle, phone }){ if(!name) throw new Error('Name is required.'); DEMO.set(me(), { name, jobTitle, phone }); },
};

/* ----- One entry point for both modes ----- */
async function peopleAction(fn, live, demoArgs, okMsg){
  if(isLive()){
    if(SB.busy){ toast('Still saving. Try again in a moment.'); return false; }
    SB.busy = true; setStatus('saving');
    try { const r = await live(); await sbLoadAll(); SB.busy = false; setStatus('live'); S.modal = null; render(); if(okMsg) toast(typeof okMsg==='function' ? okMsg(r) : okMsg); return r ?? true; }
    catch(e){ SB.busy = false; setStatus('live'); S.modal = S.modal ? { ...S.modal, err:friendlyError(e) } : null; render(); if(!S.modal) toast(friendlyError(e)); return false; }
  }
  try { const r = DEMO[fn](...demoArgs); rebuildTeams(); S.modal = null; render(); if(okMsg) toast((typeof okMsg==='function' ? okMsg(r) : okMsg) + ' (simulated)'); return r ?? true; }
  catch(e){ S.modal = S.modal ? { ...S.modal, err:e.message } : null; render(); if(!S.modal) toast(e.message); return false; }
}
const rpc = (fn, args) => async () => { const { data, error } = await SB.client.rpc(fn, args); if(error) throw error; return data; };
async function sendAuthEmail(action, userId){
  const p = person(userId);
  if(!isLive()){ toast(`${action==='reset' ? 'Password reset' : 'Invitation'} email to ${p.email} (simulated).`); DEMO.log(action==='reset' ? 'user.password_reset_sent' : 'user.invite_sent','user',p.id,{ email:p.email }); render(); return; }
  try {
    const { data, error } = await SB.client.functions.invoke('admin-users', { body:{ action, user_id:+userId, redirect_to:location.origin + location.pathname } });
    if(error){ let msg = error.message; try { msg = (await error.context.json()).error || msg; } catch(_){} throw new Error(msg); }
    toast(data?.message || 'Email sent.'); await sbLoadAll(); render();
  } catch(e){
    toast(/Failed to send a request|not found|404/i.test(e.message) ? 'The email service (Edge Function "admin-users") is not set up yet. The account is saved; send the invitation from the Supabase dashboard for now.' : `Email not sent: ${e.message}`);
  }
}

function auditText(a){
  const d = a.details || {}, nm = id => person(id)?.name || `user ${id}`;
  const subject = a.entity==='user' ? nm(a.entityId) : a.entity==='team' ? (team(a.entityId)?.name || a.entityId)
    : a.entity==='membership' ? `${nm(d.user_id)} · ${team(d.team_id)?.name || d.team_id}` : `Request #${a.entityId} (${d.request_type || ''}, ${team(d.team_id)?.name || d.team_id || ''})`;
  const changes = Object.entries(d).filter(([,x]) => x && typeof x==='object' && 'to' in x)
    .map(([k,x]) => { const f = v => k==='role_id' ? ROLE_NAMES[v] || v : v ?? '—'; return `${FIELD_TEXT[k] || k}: ${esc(String(f(x.from)))} → ${esc(String(f(x.to)))}`; }).join('<br>');
  return { subject, changes };
}
function historyTable(list){
  const rows = [...list].sort((a,b) => String(b.at).localeCompare(String(a.at)) || b.id - a.id).slice(0, 300).map(a => { const t = auditText(a);
    return `<tr><td class="mono" style="white-space:nowrap">${fdt(a.at)}</td><td>${esc(person(a.userId)?.name || 'System / dashboard')}</td><td>${ACTION_TEXT[a.action] || esc(a.action)}</td><td>${esc(t.subject)}</td><td class="secondary">${t.changes}</td></tr>`; }).join('');
  return `<div class="table-wrap"><table class="data"><thead><tr><th>When</th><th>By</th><th>Action</th><th>Record</th><th>Change</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="empty">No history yet.</td></tr>'}</tbody></table></div>`;
}

  if(type==='pm-newteam') return { title:'New sales team', submit:'Create team', body:`<div class="fields">${field('f-tid','Team code', inp('f-tid', v['f-tid'], 'text', 'T4'), { req:true, hint:'short, permanent' })}${field('f-tname','Team name', inp('f-tname', v['f-tname'], 'text', 'Team Middle East'), { req:true })}</div>` };
  if(type==='pm-team'){ const t = team(args[0]), ms = teamMembers(t.id);
    const cand = DB.people.filter(p => p.status!=='Inactive' && !['system_intake'].includes(p.role) && personTeam(p.id)!==t.id);
    const mHist = DB.memberships.filter(m => m.teamId===t.id).sort((a,b) => b.start.localeCompare(a.start));
    return { title:t.name, sub:`${t.id} · ${t.status}`, wide:true, submit:'Save changes', body:`<div class="fields">
      ${field('f-tname','Team name', inp('f-tname', v['f-tname'] ?? t.name), { req:true })}${field('f-tstatus','Status', sel('f-tstatus', ['Active','Inactive'], v['f-tstatus'] ?? t.status, null))}
      ${field('f-tadd','Add a person', sel('f-tadd', cand.map(p => [String(p.id), `${p.name} · ${ROLE_NAMES[p.role]}${p.teamId ? ' · ' + (team(p.teamId)?.name||'') : ''}`]), v['f-tadd'] || '', 'Nobody'), { hint:'moves them from any other team' })}
      ${field('f-taddrole','As', sel('f-taddrole', [['sales_executive','Sales Executive'],['sales_manager','Sales Manager']], v['f-taddrole'] || 'sales_executive', null))}</div>
      <h3 class="mini-h">Current members</h3><div class="table-wrap"><table class="data"><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Since</th><th></th></tr></thead><tbody>${memberRows(ms, { manage:true })}</tbody></table></div>
      <p class="sub">To move or remove someone, open Manage: change their team, or set Access to Inactive.</p>
      <h3 class="mini-h">Membership history</h3><div class="table-wrap"><table class="data"><thead><tr><th>Person</th><th>From</th><th>To</th><th>Status</th></tr></thead><tbody>
      ${mHist.map(m => `<tr><td>${esc(person(m.userId)?.name||'')}</td><td>${fdt(m.start)}</td><td>${fdt(m.end)}</td><td>${pill(m.status)}</td></tr>`).join('')}</tbody></table></div>` }; }
  if(type==='pm-req'){ const [kind, uid] = args, t = team(personTeam(meId()));
    if(kind==='Add') return { title:'Request New Sales Executive', sub:'Admin reviews the request. If approved, the employee receives an invitation.', submit:'Send request', body:`<div class="fields">
      ${field('f-rname','Employee name', inp('f-rname', v['f-rname']), { req:true })}${field('f-remail','Work email', inp('f-remail', v['f-remail'], 'email'), { req:true })}
      ${fixedField('Requested role','Sales Executive', false)}${fixedField('Sales team', esc(t?.name||''), false)}${field('f-rnote','Note', ta('f-rnote', v['f-rnote']), { full:true })}</div>` };
    const p = person(uid);
    return { title:`Request ${kind.toLowerCase()}: ${p.name}`, sub: kind==='Remove' ? 'If Admin approves, the person leaves the team and loses access. Their records stay.' : 'If Admin approves, the person moves to the other team with no access to your team\'s records.',
      submit:'Send request', danger: kind==='Remove', body:`<div class="fields">${kind==='Transfer' ? field('f-rto','Move to team', teamSel('f-rto', v['f-rto'] || '', DB.teams.filter(x => x.status!=='Inactive' && x.id!==t.id)), { req:true }) : ''}
      ${field('f-rnote','Note', ta('f-rnote', v['f-rnote']), { full:true })}</div>` }; }
  if(type==='pm-approve' || type==='pm-reject'){ const q = DB.requests.find(r => r.id===+args[0]), ex = q && DB.people.find(p => p.email && p.email.toLowerCase()===String(q.email).toLowerCase());
    const what = q.type==='Add' ? (ex ? `${esc(ex.name)} already has an account (${ROLE_NAMES[ex.role]}, ${ex.status}). Approving moves them into ${esc(team(q.teamId)?.name||'')} as Sales Executive.`
        : `Approving creates an invited account for ${esc(q.name)} (${esc(q.email)}) as Sales Executive in ${esc(team(q.teamId)?.name||'')}. Then send the invitation from Users.`)
      : q.type==='Remove' ? `Approving removes ${esc(q.name)} from ${esc(team(q.fromTeamId)?.name||'')} and sets the account to Inactive. Their records stay.`
      : `Approving moves ${esc(q.name)} from ${esc(team(q.fromTeamId)?.name||'')} to ${esc(team(q.teamId)?.name||'')}.`;
    const info = `<dl class="meta"><div><dt>Requested by</dt><dd>${esc(person(q.by)?.name||'')}</dd></div><div><dt>Date</dt><dd>${fdt(q.createdAt)}</dd></div><div><dt>Note</dt><dd>${esc(q.note||'—')}</dd></div></dl>`;
    return type==='pm-approve' ? { title:`Approve request #${q.id}`, sub:`${q.type} · ${q.name}`, submit:'Approve', body:`${info}<div class="infobox">${what}</div>` }
      : { title:`Reject request #${q.id}`, sub:`${q.type} · ${q.name}`, submit:'Reject request', danger:true, body:`${info}${field('f-reason','Reason for the Sales Manager', ta('f-reason', v['f-reason']), { req:true, full:true })}` }; }
  return null;
}

/* ----- Form submits ----- */
function peopleSubmit(formType, v){
  const [type, ...args] = formType.split(':'), tr = k => String(v[k]||'').trim();
  const fail = msg => { if(S.modal){ S.modal = { ...S.modal, v, err:msg }; render(); } else toast(msg); };
  if(type==='pm-profile'){ S.pf = v; S.pfErr = '';
    const p = { name:tr('f-pname'), jobTitle:tr('f-ptitle'), phone:tr('f-pphone') };
    if(!p.name){ S.pfErr = 'Name is required.'; return render(); }
    S.pf = null; return peopleAction('profile', rpc('update_my_profile', { p_full_name:p.name, p_job_title:p.jobTitle||null, p_phone:p.phone||null }), [p], 'Profile saved.'); }
  if(type==='pm-password'){ S.pwErr = '';
    if(v['f-pw1'].length < 8){ S.pwErr = 'Use at least 8 characters.'; return render(); }
    if(v['f-pw1']!==v['f-pw2']){ S.pwErr = 'The two passwords do not match.'; return render(); }
    return SB.client.auth.updateUser({ password:v['f-pw1'] }).then(({ error }) => { if(error){ S.pwErr = friendlyError(error); render(); } else { render(); toast('Password changed.'); } }); }
  if(type==='pm-invite'){ const d = { name:tr('f-uname'), email:tr('f-uemail').toLowerCase(), role:v['f-urole'], teamId:isSalesRole(v['f-urole']) ? v['f-uteam'] : '', jobTitle:tr('f-utitle') };
    if(!d.name || !d.email || !d.role) return fail('Name, work email and role are required.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return fail('Enter a valid work email.');
    if(isSalesRole(d.role) && !d.teamId) return fail('Choose the sales team for this role.');
    return peopleAction('createUser', rpc('admin_create_user', { p_full_name:d.name, p_email:d.email, p_role_id:d.role, p_team_id:d.teamId||null, p_job_title:d.jobTitle||null }), [d],
      id => `${d.name} created with status Invited.`).then(id => { if(id) sendAuthEmail('invite', id); }); }
  if(type==='pm-user'){ const p = person(args[0]), self = p.id===meId();
    const name = tr('f-uname'), role = self ? p.role : v['f-urole'], status = self ? (p.status==='Inactive' ? 'Inactive' : 'Active') : v['f-ustatus'], tid = v['f-uteam'] || '';
    if(!name) return fail('Name is required.');
    if(isSalesRole(role) && status!=='Inactive' && !tid) return fail('Choose the sales team for this role.');
    const steps = [];   // [demo fn, demo args, live rpc]
    if(name!==p.name || tr('f-utitle')!==(p.jobTitle||'') || tr('f-uphone')!==(p.phone||''))
      steps.push(['updateUser', [p.id, { name, jobTitle:tr('f-utitle'), phone:tr('f-uphone') }], ['admin_update_user', { p_user_id:p.id, p_full_name:name, p_job_title:tr('f-utitle')||null, p_phone:tr('f-uphone')||null }]]);
    const wasInactive = p.status==='Inactive';
    if(status==='Inactive' && !wasInactive) steps.push(['setStatus', [p.id, 'Inactive'], ['admin_set_status', { p_user_id:p.id, p_status:'Inactive' }]]);
    if(role!==p.role) steps.push(['changeRole', [p.id, role, isSalesRole(role) ? tid : null], ['admin_change_role', { p_user_id:p.id, p_role_id:role, p_team_id:isSalesRole(role) && status!=='Inactive' ? tid : null }]]);
    if(status==='Active' && wasInactive) steps.push(['setStatus', [p.id, 'Active', tid], ['admin_set_status', { p_user_id:p.id, p_status:'Active', p_team_id:isSalesRole(role) ? tid : null }]]);
    else if(role===p.role && status!=='Inactive' && isSalesRole(role) && tid && tid!==p.teamId) steps.push(['transfer', [p.id, tid], ['admin_transfer_user', { p_user_id:p.id, p_team_id:tid }]]);
    if(!steps.length){ S.modal = null; render(); return toast('No changes.'); }
    if(isLive()) return peopleAction(null, async () => { for(const [, , [fn, a]] of steps){ const { error } = await SB.client.rpc(fn, a); if(error) throw error; } }, [], `${name} updated.`);
    const snapshot = clone({ people:DB.people, memberships:DB.memberships, audit:DB.audit });
    try { steps.forEach(([fn, a]) => DEMO[fn](...a)); } catch(e){ Object.assign(DB, snapshot); rebuildTeams(); return fail(e.message); }
    rebuildTeams(); S.modal = null; render(); return toast(`${name} updated (simulated).`); }
  if(type==='pm-newteam'){ const id = tr('f-tid').toUpperCase(), name = tr('f-tname');
    if(!id || !name) return fail('Team code and name are required.');
    if(!/^[A-Z0-9-]{1,10}$/.test(id)) return fail('Team code: up to 10 letters, numbers or dashes (for example T4).');
    return peopleAction('createTeam', rpc('admin_create_team', { p_team_id:id, p_team_name:name }), [id, name], `${name} created.`); }
  if(type==='pm-team'){ const t = team(args[0]), name = tr('f-tname'), st = v['f-tstatus'], add = v['f-tadd'], asRole = v['f-taddrole'];
    if(!name) return fail('Team name is required.');
    const steps = [];
    if(name!==t.name) steps.push(['renameTeam', [t.id, name], ['admin_rename_team', { p_team_id:t.id, p_team_name:name }]]);
    if(add){ const p = person(add);
      steps.push(p.role===asRole ? ['transfer', [p.id, t.id], ['admin_transfer_user', { p_user_id:p.id, p_team_id:t.id }]]
        : ['changeRole', [p.id, asRole, t.id], ['admin_change_role', { p_user_id:p.id, p_role_id:asRole, p_team_id:t.id }]]); }
    if(st!==t.status) steps.push(['setTeamStatus', [t.id, st], ['admin_set_team_status', { p_team_id:t.id, p_status:st }]]);
    if(!steps.length){ S.modal = null; render(); return toast('No changes.'); }
    if(isLive()) return peopleAction(null, async () => { for(const [, , [fn, a]] of steps){ const { error } = await SB.client.rpc(fn, a); if(error) throw error; } }, [], `${name} updated.`);
    const snapshot = clone({ people:DB.people, memberships:DB.memberships, audit:DB.audit, teams:DB.teams });
    try { steps.forEach(([fn, a]) => DEMO[fn](...a)); } catch(e){ Object.assign(DB, snapshot); rebuildTeams(); return fail(e.message); }
    rebuildTeams(); S.modal = null; render(); return toast(`${name} updated (simulated).`); }
  if(type==='pm-req'){ const [kind, uid] = args;
    const d = { type:kind, name:tr('f-rname'), email:tr('f-remail').toLowerCase(), targetId:uid ? +uid : null, toTeamId:v['f-rto'] || null, note:tr('f-rnote') };
    if(kind==='Add' && (!d.name || !d.email)) return fail('Employee name and work email are required.');
    if(kind==='Add' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return fail('Enter a valid work email.');
    if(kind==='Transfer' && !d.toTeamId) return fail('Choose the team to move to.');
    return peopleAction('request', rpc('request_team_change', { p_request_type:kind, p_employee_name:d.name||null, p_employee_email:d.email||null, p_target_user_id:d.targetId, p_to_team_id:d.toTeamId, p_note:d.note||null }),
      [d], 'Request sent to Admin.'); }
  if(type==='pm-approve') return peopleAction('review', rpc('review_access_request', { p_request_id:+args[0], p_approve:true }), [args[0], true], 'Request approved.');
  if(type==='pm-reject'){ const reason = tr('f-reason'); if(!reason) return fail('Give a reason for the rejection.');
    return peopleAction('review', rpc('review_access_request', { p_request_id:+args[0], p_approve:false, p_rejection_reason:reason }), [args[0], false, reason], 'Request rejected.'); }
}

/* ----- Live loading of people data (called from sbLoadAll) ----- */
async function sbLoadPeople(c, role){
  const empty = Promise.resolve([]);
  const [dir, users, teams, members, reqs, audit] = await Promise.all([
    role==='lead_submitter' ? empty : q(c.rpc('user_directory')),
    q(c.from('users').select('user_id,full_name,email,role_id,account_status,job_title,phone,created_at,last_login_at')),
    role==='lead_submitter' ? empty : q(c.from('sales_teams').select('team_id,team_name,team_status').order('team_id')),
    q(c.from('team_memberships').select('*').order('membership_id')),
    ['admin','sales_manager'].includes(role) ? q(c.from('user_access_requests').select('*').order('request_id')) : empty,
    role==='admin' ? q(c.from('audit_logs').select('*').order('log_id', { ascending:false }).limit(1000)) : empty,
  ]);
  const byId = Object.fromEntries(users.map(u => [u.user_id, u]));
  const ids = new Set([...dir.map(d => d.user_id), ...users.map(u => u.user_id)]);
  DB.people = [...ids].sort((a,b) => a-b).map(id => { const u = byId[id], d = dir.find(x => x.user_id===id);
    return { id, name:(u||d).full_name, email:u?.email || '', role:u?.role_id || d.role_id, status:u?.account_status || 'Active', jobTitle:u?.job_title || '', phone:u?.phone || '',
      createdAt:u?.created_at || '', lastLogin:u?.last_login_at || '', partial:!u }; });
  SB.users = Object.fromEntries(DB.people.map(p => [p.id, { full_name:p.name, role:p.role }]));
  DB.memberships = members.map(m => ({ id:m.membership_id, userId:m.user_id, teamId:m.team_id, status:m.membership_status, start:m.start_date, end:m.end_date || '' }));
  DB.teams = teams.map(t => ({ id:t.team_id, name:t.team_name, status:t.team_status }));
  DB.requests = reqs.map(r => ({ id:r.request_id, type:r.request_type, name:r.employee_name || '', email:r.employee_email || '', targetId:r.target_user_id, teamId:r.requested_team_id,
    fromTeamId:r.from_team_id, note:r.note || '', by:r.requested_by_user_id, reviewer:r.reviewed_by_user_id, status:r.request_status, reason:r.rejection_reason || '',
    resultId:r.resulting_user_id, createdAt:r.created_at, reviewedAt:r.reviewed_at || '' }));
  DB.audit = audit.map(a => ({ id:a.log_id, userId:a.user_id, action:a.action, entity:a.entity_type, entityId:a.entity_id, details:a.details || {}, at:a.logged_at }));
  rebuildTeams();
}

resetDemoPeople();   // demo people until someone signs in

boot();
